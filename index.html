<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事故現場・安全守護者：風險分析電子報</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            --siren: #ef4444;
            --tape: #facc15;
            --maze-line: rgba(248, 113, 113, 0.55);
        }
        body { background: #0b0f19; color: #1f2937; overflow-x: hidden; }
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-thumb { background-color: #fca5a5; border-radius: 4px; }
        .lucide { display: inline-block; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .student-reflection-area { resize: none; }
        .hidden { display: none !important; }

        /* ── 背景：無限延伸的迷宮地板 ── */
        .bg-maze { position: fixed; inset: 0; z-index: -1; overflow: hidden; perspective: 380px;
            background: radial-gradient(ellipse at 50% 35%, #3b0d12 0%, #0b0f19 60%); }
        .bg-maze::before { content: ''; position: absolute; left: -50%; right: -50%; top: 55%; height: 140%;
            transform: rotateX(72deg); transform-origin: top center;
            background-image:
                linear-gradient(to right, var(--maze-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--maze-line) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: floorMove 3s linear infinite;
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%);
                    mask-image: linear-gradient(to bottom, transparent, #000 35%); }
        .bg-maze::after { content: ''; position: absolute; left: 50%; top: 30%; width: 60vmax; height: 60vmax;
            transform: translate(-50%, -50%); border-radius: 50%;
            background: radial-gradient(circle, rgba(239,68,68,0.25), transparent 60%);
            animation: sirenPulse 2.4s ease-in-out infinite; }
        @keyframes floorMove { from { background-position: 0 0; } to { background-position: 0 80px; } }
        @keyframes sirenPulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

        /* ── 全螢幕 4D 迷宮（入場 / 轉場） ── */
        .maze-overlay { position: fixed; inset: 0; z-index: 50; background: #05070d; overflow: hidden;
            transition: opacity .5s ease; }
        .maze-overlay.fade-out { opacity: 0; pointer-events: none; }
        .maze-scene { position: absolute; inset: 0; perspective: 500px; perspective-origin: 50% 50%; }
        .maze-corridor { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
            transform-style: preserve-3d; animation: mazeTurn 10s ease-in-out infinite; }
        .maze-overlay.rushing .maze-corridor { animation: rushIn 1.1s cubic-bezier(.55,0,.9,.4) forwards; }
        .plane { position: absolute; --speed: 2.2s;
            background-color: #0d1220; }
        .maze-overlay.rushing .plane, .maze-overlay.transit .plane { --speed: .45s; }
        .plane.floor, .plane.ceiling { width: 400px; height: 3000px; left: -200px; top: -1500px; }
        .plane.floor { transform: translate3d(0, 150px, -1050px) rotateX(90deg);
            background-image:
                linear-gradient(to bottom, #05070d 0%, transparent 55%),
                linear-gradient(to right, transparent 48%, rgba(250,204,21,.7) 48%, rgba(250,204,21,.7) 52%, transparent 52%),
                linear-gradient(to bottom, var(--maze-line) 2px, transparent 2px),
                linear-gradient(to right, var(--maze-line) 2px, transparent 2px);
            background-size: 100% 100%, 100% 160px, 100px 100px, 100px 100px;
            animation: moveY var(--speed) linear infinite; }
        .plane.ceiling { transform: translate3d(0, -150px, -1050px) rotateX(-90deg);
            background-image:
                linear-gradient(to top, #05070d 0%, transparent 55%),
                radial-gradient(ellipse 40px 18px at 50% 50%, rgba(254,202,202,.9), transparent 70%),
                linear-gradient(to bottom, rgba(148,163,184,.25) 2px, transparent 2px);
            background-size: 100% 100%, 100% 400px, 100px 100px;
            animation: moveYNeg var(--speed) linear infinite; }
        .plane.wall-left, .plane.wall-right { width: 3000px; height: 300px; left: -1500px; top: -150px; }
        .plane.wall-left { transform: translate3d(-200px, 0, -1050px) rotateY(90deg);
            background-image:
                linear-gradient(to left, #05070d 0%, transparent 55%),
                repeating-linear-gradient(to right, transparent 0 420px, #000 420px 560px, transparent 560px 600px),
                linear-gradient(to right, var(--maze-line) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(239,68,68,.35) 2px, transparent 2px);
            background-size: 100% 100%, 600px 100%, 100px 100%, 100% 75px;
            animation: moveXNeg var(--speed) linear infinite; }
        .plane.wall-right { transform: translate3d(200px, 0, -1050px) rotateY(-90deg);
            background-image:
                linear-gradient(to right, #05070d 0%, transparent 55%),
                repeating-linear-gradient(to right, transparent 0 40px, #000 40px 180px, transparent 180px 600px),
                linear-gradient(to right, var(--maze-line) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(239,68,68,.35) 2px, transparent 2px);
            background-size: 100% 100%, 600px 100%, 100px 100%, 100% 75px;
            animation: moveX var(--speed) linear infinite; }
        .plane.end-wall { width: 400px; height: 300px; left: -200px; top: -150px;
            transform: translateZ(-2540px);
            background: radial-gradient(circle at 50% 55%, rgba(239,68,68,.95), rgba(127,29,29,.6) 35%, #05070d 70%);
            animation: sirenPulse 1.2s ease-in-out infinite; }
        @keyframes moveY { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 160px, 0 200px, 0 200px; } }
        @keyframes moveYNeg { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 -400px, 0 -200px; } }
        @keyframes moveX { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 0 0, 600px 0, 200px 0, 0 0; } }
        @keyframes moveXNeg { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 0 0, -600px 0, -200px 0, 0 0; } }
        /* 迷宮轉彎＋行走時的上下晃動（第四維：時間） */
        @keyframes mazeTurn {
            0%   { transform: rotateY(0deg) translateY(0); }
            20%  { transform: rotateY(-16deg) translateY(4px); }
            35%  { transform: rotateY(-16deg) translateY(-3px); }
            55%  { transform: rotateY(14deg) translateY(4px); }
            75%  { transform: rotateY(14deg) translateY(-3px); }
            100% { transform: rotateY(0deg) translateY(0); }
        }
        @keyframes rushIn { from { transform: translateZ(0); } to { transform: translateZ(2300px); } }

        .maze-vignette { position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%); }
        .maze-siren { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
            background: radial-gradient(circle at 15% 0%, rgba(239,68,68,.45), transparent 40%),
                        radial-gradient(circle at 85% 0%, rgba(59,130,246,.4), transparent 40%);
            animation: sirenSwap 1s steps(2, jump-none) infinite; }
        @keyframes sirenSwap { 0% { filter: hue-rotate(0deg); opacity: .9; } 100% { filter: hue-rotate(180deg); opacity: .6; } }
        .maze-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
        .maze-overlay.rushing .maze-flash { animation: flash 1.1s ease-in forwards; }
        @keyframes flash { 0%, 70% { opacity: 0; } 100% { opacity: 1; } }

        .maze-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 16px; color: #fff; }
        .maze-title { font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 900; letter-spacing: .08em;
            text-shadow: 0 0 18px rgba(239,68,68,.9), 0 0 40px rgba(239,68,68,.5);
            animation: glitch 3.5s infinite; }
        @keyframes glitch {
            0%, 92%, 100% { transform: translate(0); text-shadow: 0 0 18px rgba(239,68,68,.9), 0 0 40px rgba(239,68,68,.5); }
            93% { transform: translate(-3px, 1px); text-shadow: 3px 0 #22d3ee, -3px 0 #ef4444; }
            95% { transform: translate(3px, -1px); text-shadow: -3px 0 #22d3ee, 3px 0 #ef4444; }
            97% { transform: translate(-1px, 0); }
        }
        .maze-sub { margin-top: .75rem; font-size: clamp(1rem, 2.6vw, 1.35rem); color: #fecaca; }
        .maze-btn { margin-top: 2rem; padding: .9rem 2.2rem; border-radius: 9999px; font-weight: 800; font-size: 1.15rem;
            background: var(--siren); color: #fff; border: 2px solid #fecaca; cursor: pointer;
            box-shadow: 0 0 0 0 rgba(239,68,68,.7); animation: btnPulse 1.6s infinite; }
        .maze-btn:hover { background: #dc2626; }
        @keyframes btnPulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.7); } 70% { box-shadow: 0 0 0 22px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        .maze-skip { position: absolute; right: 16px; bottom: 16px; color: #9ca3af; font-size: .85rem; text-decoration: underline; cursor: pointer; background: none; border: 0; }

        /* 封鎖線：走進去時被撕開 */
        .tape { position: absolute; left: -10%; width: 120%; padding: .5rem 0; font-weight: 900; letter-spacing: .3em;
            white-space: nowrap; overflow: hidden; color: #111827; font-size: clamp(.8rem, 2vw, 1.05rem);
            background: repeating-linear-gradient(-45deg, var(--tape) 0 28px, #111827 28px 40px);
            box-shadow: 0 6px 20px rgba(0,0,0,.6); transition: transform .9s cubic-bezier(.6,-0.3,.7,1), opacity .9s; }
        .tape span { background: var(--tape); padding: 0 .6rem; }
        .tape.t1 { top: 22%; transform: rotate(-8deg); }
        .tape.t2 { bottom: 20%; transform: rotate(6deg); }
        .maze-overlay.rushing .tape.t1 { transform: rotate(-8deg) translateX(-130%); opacity: 0; }
        .maze-overlay.rushing .tape.t2 { transform: rotate(6deg) translateX(130%); opacity: 0; }
        .maze-overlay.rushing .maze-ui > * { opacity: 0; transform: scale(1.6); transition: all .6s ease-in; }
        .maze-overlay.transit .maze-ui { animation: transitText 1.3s ease forwards; }
        @keyframes transitText { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.8); } }

        /* ── 頁面內容動畫 ── */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scene-enter { animation: sceneEnter .7s cubic-bezier(.2,.8,.2,1); transform-origin: 50% 0; }
        @keyframes sceneEnter { from { opacity: 0; transform: perspective(900px) translateZ(-260px) rotateX(8deg); } to { opacity: 1; transform: none; } }

        .caution-strip { height: 10px; border-radius: 9999px; margin-bottom: 1.25rem;
            background: repeating-linear-gradient(-45deg, var(--tape) 0 14px, #111827 14px 24px);
            background-size: 34px 34px; animation: stripMove 1s linear infinite; }
        @keyframes stripMove { from { background-position: 0 0; } to { background-position: 34px 0; } }

        /* 首頁案例卡＝迷宮裡的三扇門 */
        .door-grid { perspective: 1000px; }
        .door-card { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
            animation: doorIn .8s cubic-bezier(.2,.8,.2,1) backwards; overflow: hidden; }
        .door-card:nth-child(2) { animation-delay: .12s; }
        .door-card:nth-child(3) { animation-delay: .24s; }
        .door-card:nth-child(4) { animation-delay: .36s; }
        @keyframes doorIn { from { opacity: 0; transform: translateZ(-400px) rotateY(-25deg); } to { opacity: 1; transform: none; } }
        .door-card.open:hover { transform: translateZ(40px) rotateY(-6deg) rotateX(3deg); box-shadow: 0 25px 50px rgba(239,68,68,.35); }
        .door-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.6) 50%, transparent 60%);
            background-size: 250% 100%; }
        .door-card.open:hover::before { opacity: 1; animation: sheen 1.1s ease; }
        @keyframes sheen { from { background-position: 100% 0; } to { background-position: -50% 0; } }
        .door-light { position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #ef4444); background-size: 200% 100%;
            animation: lightRun 2s linear infinite; }
        @keyframes lightRun { from { background-position: 0 0; } to { background-position: 200% 0; } }

        /* 骨牌連鎖視覺 */
        .domino-chain { display: flex; justify-content: center; align-items: flex-end; gap: clamp(14px, 4vw, 34px);
            height: 96px; padding: 0 12px 10px; margin-bottom: 1.5rem; border-bottom: 4px solid #374151; }
        .domino-tile { width: clamp(22px, 5vw, 34px); height: clamp(60px, 13vw, 80px); border-radius: 6px;
            background: linear-gradient(180deg, #1f2937, #111827); border: 2px solid #f87171;
            display: flex; align-items: center; justify-content: center; color: #fecaca; font-weight: 800; font-size: .8rem;
            transform-origin: 100% 100%; transition: transform .6s cubic-bezier(.5,0,.75,1.4), background .6s; }
        .domino-tile.fallen { transform: rotate(62deg); background: linear-gradient(180deg, #ef4444, #991b1b); color: #fff; }
        .domino-item { transition: transform .3s ease, box-shadow .3s ease; }
        .domino-item.knock { animation: knock .7s cubic-bezier(.5,0,.5,1); }
        @keyframes knock { 0% { transform: rotateX(0); } 35% { transform: perspective(600px) rotateX(-28deg); } 70% { transform: perspective(600px) rotateX(6deg); } 100% { transform: none; } }

        .stage-1 { background-color: #d1fae5; border-left-color: #10b981; }
        .stage-2 { background-color: #fffbeb; border-left-color: #f59e0b; }
        .stage-3 { background-color: #fee2e2; border-left-color: #ef4444; }

        /* 自動儲存提示 */
        .next-pulse { animation: nextPulse 1.8s ease-in-out infinite; }
        @keyframes nextPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); } }
        .save-pill { position: fixed; right: 16px; bottom: 16px; z-index: 40; padding: .45rem .9rem; border-radius: 9999px;
            background: rgba(17,24,39,.9); color: #bbf7d0; font-size: .8rem; opacity: 0; transform: translateY(8px);
            transition: opacity .3s, transform .3s; pointer-events: none; }
        .save-pill.show { opacity: 1; transform: none; }
        .toast { position: fixed; left: 50%; top: 20px; z-index: 60; transform: translate(-50%, -20px); opacity: 0;
            background: #111827; color: #fff; padding: .7rem 1.2rem; border-radius: .75rem; border-left: 5px solid var(--siren);
            transition: all .3s; max-width: calc(100% - 32px); pointer-events: none; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }


        /* ── 事故故事：時間線電影播放器 ── */
        .stage { position: relative; height: clamp(260px, 42vw, 400px); border-radius: 1rem; overflow: hidden;
            background: linear-gradient(180deg, #1e293b, #0f172a); color: #fff; isolation: isolate; }
        .stage .sky { position: absolute; inset: 0; z-index: -2; transition: background 1s; }
        .stage .ground { position: absolute; left: -20%; right: -20%; bottom: 0; height: 38%; z-index: -1;
            transform: perspective(300px) rotateX(55deg); transform-origin: bottom;
            background-image: linear-gradient(to right, rgba(255,255,255,.12) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,.12) 1px, transparent 1px);
            background-size: 50px 50px; animation: floorMove 4s linear infinite; }
        .stage .hero { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); }
        .stage .hero .lucide { width: clamp(70px, 14vw, 130px); height: clamp(70px, 14vw, 130px); stroke-width: 1.5;
            filter: drop-shadow(0 0 18px rgba(255,255,255,.35)); }
        .stage .particles span { position: absolute; border-radius: 50%; pointer-events: none; }
        .stage .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 1rem 1.25rem 1.1rem;
            background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.55) 70%, transparent); }
        .stage .caption .time { display: inline-block; font-weight: 800; font-size: .8rem; letter-spacing: .1em;
            background: var(--tape); color: #111827; padding: .15rem .6rem; border-radius: 9999px; }
        .stage .caption h4 { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 900; margin: .35rem 0 .25rem; }
        .stage .caption p { font-size: clamp(.95rem, 2.1vw, 1.1rem); line-height: 1.6; color: #e5e7eb; min-height: 3.2em; }
        .chapter-in { animation: chapterIn .8s cubic-bezier(.2,.8,.2,1); }
        @keyframes chapterIn { from { opacity: 0; transform: scale(1.12); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

        .fx-calm .sky { background: radial-gradient(ellipse at 50% 20%, #7c3aed 0%, #1e1b4b 55%, #0f172a 100%); }
        .fx-calm .hero { animation: bob 3s ease-in-out infinite; }
        .fx-spin .sky { background: radial-gradient(ellipse at 50% 30%, #0ea5e9, #1e3a8a 60%, #0f172a); }
        .fx-spin .hero .lucide { animation: spin 4s linear infinite; }
        .fx-spinfast .sky { background: radial-gradient(ellipse at 50% 30%, #f59e0b, #7c2d12 60%, #0f172a); }
        .fx-spinfast .hero .lucide { animation: spin .5s linear infinite; }
        .fx-impact .sky { background: radial-gradient(circle at 50% 45%, #fca5a5, #991b1b 45%, #1f0a0a); }
        .fx-impact { animation: shake .45s 2; }
        .fx-impact .hero .lucide { animation: throb .8s ease-in-out infinite; }
        .fx-powder .sky { background: radial-gradient(ellipse at 50% 20%, #db2777, #6d28d9 45%, #0f172a); }
        .fx-fire .sky { background: radial-gradient(ellipse at 50% 90%, #fde047, #f97316 25%, #b91c1c 55%, #1c0505); animation: flicker .25s infinite alternate; }
        .fx-fire .hero .lucide { animation: throb .5s ease-in-out infinite; color: #fef08a; }
        .fx-siren .sky { background: #0f172a; }
        .fx-siren .sky::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(239,68,68,.75), transparent 45%), radial-gradient(circle at 80% 20%, rgba(59,130,246,.75), transparent 45%);
            animation: sirenSwap .8s steps(2, jump-none) infinite; }
        .fx-hospital .sky { background: radial-gradient(ellipse at 50% 30%, #99f6e4, #0f766e 55%, #042f2e); }
        .fx-hospital .hero { animation: bob 3s ease-in-out infinite; }
        .fx-dark .sky { background: radial-gradient(ellipse at 50% 40%, #374151, #030712 70%); }
        .fx-dark .hero .lucide { color: #fca5a5; animation: fadeBeat 3s ease-in-out infinite; }
        .fx-court .sky { background: radial-gradient(ellipse at 50% 30%, #a16207, #422006 60%, #0c0a09); }
        .fx-court .hero .lucide { transform-origin: 80% 80%; animation: gavel 1.6s ease-in-out infinite; }
        .fx-shake .sky { background: radial-gradient(ellipse at 50% 30%, #475569, #0f172a 70%); }
        .fx-shake { animation: shake .3s linear infinite; }
        .fx-rubble .sky { background: radial-gradient(ellipse at 50% 30%, #78716c, #292524 60%, #0c0a09); }
        .fx-rubble .hero .lucide { animation: tilt 2.5s ease-in forwards; transform-origin: 50% 100%; }
        @keyframes bob { 0%,100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -58%); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes flicker { from { filter: brightness(1); } to { filter: brightness(1.35); } }
        @keyframes fadeBeat { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
        @keyframes gavel { 0%,60%,100% { transform: rotate(0); } 30% { transform: rotate(-35deg); } }
        @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -3px); } 75% { transform: translate(-3px, -2px); } }
        @keyframes tilt { from { transform: rotate(0); } to { transform: rotate(14deg); } }
        @keyframes rise { from { transform: translateY(0) scale(1); opacity: .95; } to { transform: translateY(-420px) scale(.3); opacity: 0; } }
        @keyframes drift { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(var(--dx), -140px) scale(1.8); opacity: 0; } }
        @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(460px) rotate(300deg); opacity: .6; } }

        .timeline { position: relative; display: flex; justify-content: space-between; margin: 1.5rem .5rem .5rem; }
        .timeline::before { content: ''; position: absolute; left: 0; right: 0; top: 13px; height: 4px; background: #e5e7eb; border-radius: 4px; }
        .timeline .bar { position: absolute; left: 0; top: 13px; height: 4px; background: linear-gradient(90deg, #f59e0b, #ef4444); border-radius: 4px; transition: width .6s ease; }
        .timeline button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: .35rem; background: none; border: 0; cursor: pointer; flex: 1; min-width: 0; }
        .timeline .dot { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 4px solid #d1d5db; transition: all .3s; font-size: .75rem; font-weight: 800; color: #9ca3af; display: flex; align-items: center; justify-content: center; }
        .timeline .seen .dot { border-color: #ef4444; color: #ef4444; }
        .timeline .current .dot { background: #ef4444; color: #fff; transform: scale(1.2); box-shadow: 0 0 0 6px rgba(239,68,68,.2); }
        .timeline .label { font-size: .72rem; color: #6b7280; text-align: center; line-height: 1.2; padding: 0 2px; }
        .timeline .current .label { color: #b91c1c; font-weight: 700; }
        @media (max-width: 640px) { .timeline .label { display: none; } }

        /* ── 現場模擬 ── */
        .sim-card { border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,.12); border: 1px solid #e5e7eb; }
        .sim-card .stage { height: clamp(150px, 22vw, 200px); border-radius: 0; }
        .sim-opt { text-align: left; width: 100%; padding: .85rem 1rem; border-radius: .75rem; border: 2px solid #e5e7eb; background: #fff; transition: all .2s; }
        .sim-opt:not(:disabled):hover { border-color: #f87171; background: #fef2f2; transform: translateX(4px); }
        .sim-opt.right { border-color: #22c55e; background: #f0fdf4; }
        .sim-opt.wrong { border-color: #ef4444; background: #fef2f2; }
        .sim-opt:disabled { cursor: default; }

        .stepper a { position: relative; }
        .stepper .num { display: inline-flex; width: 1.5rem; height: 1.5rem; border-radius: 50%; align-items: center; justify-content: center; font-size: .8rem; margin-right: .35rem; background: #f3f4f6; }
        .stepper .done .num { background: #22c55e; color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        }
    </style>
</head>

<script>
// ═══════════════════════════════════════════════
// 設定：後端 URL
// ═══════════════════════════════════════════════
// 預設後端網址：Google Apps Script 網頁應用程式（網址固定，不需要開電腦）
// 若要臨時改用其他後台，可以發給學生這種連結：
//   https://leilei1221.github.io/safety-activity/?api=其他後台網址
// 網址會被記在學生的瀏覽器裡；加上 ?api=default 可以恢復成預設後台。
const DEFAULT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbxzTzhMLAL2On_O4YRnIYhvFBvH65B8Af9GUUM6LOLKkrp_PmjtrxqojaBYd_LtUNqNTg/exec";

function getBackendUrl() {
    return (safeGet('sg_backend_url') || DEFAULT_BACKEND_URL).replace(/\/+$/, '');
}
(function captureBackendFromQuery() {
    const api = new URLSearchParams(location.search).get('api');
    if (api && /^https?:\/\//.test(api)) safeSet('sg_backend_url', api);
    if (api === 'default') { try { localStorage.removeItem('sg_backend_url'); } catch (_) {} }
})();

// ═══════════════════════════════════════════════
// 本機暫存（localStorage）：重新整理、跳頁都不會遺失
// ═══════════════════════════════════════════════
const STORAGE_KEY = 'safety-guardian-v2';

function safeGet(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
function safeSet(key, val) { try { localStorage.setItem(key, val); return true; } catch (_) { return false; } }

function emptyState() {
    return {
        studentInfo: { class_name: '', seat: '', name: '' },
        storySeen: {},         // {caseKey: 看過的最後一章 index}
        simResults: {},        // {caseKey: {index: {choice, correct}}}
        dominoState: {},       // {caseKey: {inputs:{0:''..}, revealed:{0:true..}}}
        quizResults: {},       // {caseKey: {index: {selected, correct, isCorrect}}}
        preventionOptions: {}, // {caseKey: [[opt,...], ...]} 固定亂序，避免選項跳來跳去
        submissions: {}        // {caseKey: {status, id, feedback, error, submittedAt}}
    };
}

let state = loadState();

function loadState() {
    const raw = safeGet(STORAGE_KEY);
    if (!raw) return emptyState();
    try {
        const s = Object.assign(emptyState(), JSON.parse(raw));
        // 上次送出到一半就關掉頁面 → 改成「失敗」，讓學生可以再送一次
        Object.values(s.submissions).forEach(sub => {
            if (sub && sub.status === 'sending') { sub.status = 'failed'; sub.error = '上次送出時頁面被關閉，不確定是否送達'; }
        });
        return s;
    } catch (_) { return emptyState(); }
}

let savePillTimer = null;
function saveState(showPill = true) {
    const ok = safeSet(STORAGE_KEY, JSON.stringify(state));
    if (!showPill) return;
    const pill = document.getElementById('save-pill');
    const t = new Date();
    pill.textContent = ok
        ? `✓ 已自動儲存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`
        : '⚠ 此瀏覽器無法暫存（可能是無痕模式），請勿重新整理';
    pill.classList.add('show');
    clearTimeout(savePillTimer);
    savePillTimer = setTimeout(() => pill.classList.remove('show'), ok ? 1500 : 5000);
}

let debounceTimer = null;
function saveStateDebounced() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => saveState(), 400);
}
// 關閉分頁 / 切到背景前一定寫入
window.addEventListener('pagehide', () => { clearTimeout(debounceTimer); saveState(false); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(false); });

function getDomino(caseKey) {
    if (!state.dominoState[caseKey]) state.dominoState[caseKey] = { inputs: {}, revealed: {} };
    return state.dominoState[caseKey];
}

// ═══════════════════════════════════════════════
// 工具
// ═══════════════════════════════════════════════
const contentContainer = document.getElementById('content-container');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function icons() { if (window.lucide) lucide.createIcons(); }

let toastTimer = null;
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

const ALL_LEVELS = ['一級：促進健康', '二級：特殊保護', '三級：早期診斷與治療', '四級：限制失能', '五級：復健'];
const TABS = ['story', 'sim', 'domino', 'prevention', 'report'];

// ═══════════════════════════════════════════════
// 4D 迷宮動畫
// ═══════════════════════════════════════════════
const overlay = document.getElementById('maze-overlay');
const mazeUI = document.getElementById('maze-ui');
let overlayBusy = false;

function showIntro() {
    if (reduceMotion) return;
    overlay.className = 'maze-overlay';
    mazeUI.innerHTML = `
        <div class="maze-title">事故現場</div>
        <div class="maze-sub">每一場意外，都是一連串倒下的骨牌。<br>走進迷宮，找出它們、阻止它們。</div>
        <button class="maze-btn" data-action="enter-maze">走進事故現場 →</button>
        <button class="maze-skip" data-action="skip-intro">略過動畫</button>`;
    overlay.setAttribute('aria-hidden', 'false');
}

async function enterMaze() {
    if (overlayBusy) return;
    overlayBusy = true;
    overlay.classList.add('rushing');
    await sleep(1050);
    await hideOverlay();
    overlayBusy = false;
}

async function hideOverlay() {
    overlay.classList.add('fade-out');
    await sleep(450);
    overlay.className = 'maze-overlay hidden';
    overlay.setAttribute('aria-hidden', 'true');
    mazeUI.innerHTML = '';
    try { sessionStorage.setItem('sg_intro_seen', '1'); } catch (_) {}
}

// 從首頁「走進」某個案例時的快速穿越迷宮轉場
async function playTransit(caseKey, renderFn) {
    if (reduceMotion || overlayBusy) { renderFn(); return; }
    overlayBusy = true;
    overlay.className = 'maze-overlay transit';
    mazeUI.innerHTML = `
        <div class="maze-sub" style="letter-spacing:.3em">ENTERING ・ 進入事故現場</div>
        <div class="maze-title" style="font-size:clamp(1.6rem,5vw,3.2rem)">${esc(cases[caseKey].title)}</div>`;
    await sleep(900);
    renderFn();           // 在迷宮後面先把頁面畫好
    overlay.classList.add('rushing');
    await sleep(450);
    await hideOverlay();
    overlayBusy = false;
}

// ═══════════════════════════════════════════════
// 路由：用網址 #/taroko/prevention 記住位置
//  → 上一頁/下一頁可用、重新整理不會跳回首頁
// ═══════════════════════════════════════════════
let currentRoute = { page: null, tab: null };

function parseRoute() {
    // 同時接受「#/taroko/sim」與 3D 頁面使用的簡寫「#taroko.sim」
    const parts = location.hash.replace(/^#\/?/, '').split(/[/.]/).filter(Boolean);
    if (parts[0] && cases[parts[0]]) {
        return { page: parts[0], tab: TABS.includes(parts[1]) ? parts[1] : 'story' };
    }
    return { page: 'home', tab: null };
}

function infoFilled() { return !!(state.studentInfo.class_name && state.studentInfo.seat && state.studentInfo.name); }

// 「時間之河」按鈕：回到 3D 頁面上目前這起事件的那一站
const riverLink = document.getElementById('river-link');
const riverBase = riverLink.getAttribute('href').split('#')[0];
function updateRiverLink(page) {
    riverLink.href = page && page !== 'home' ? `${riverBase}#at.${page}` : riverBase;
    riverLink.onclick = () => { try { if (page && page !== 'home') localStorage.setItem('sg_river_at', page); } catch (_) {} };
}
function router() {
    const route = parseRoute();
    updateRiverLink(route.page);
    if (route.page !== 'home' && !infoFilled()) {
        // 記住原本要去的頁面（例如從 3D 時間之河過來），填完資料後自動帶過去
        try { sessionStorage.setItem('sg_pending', location.hash); } catch (_) {}
        toast('請先填寫班級、座號、姓名，填完會自動帶你到剛剛的頁面！');
        location.replace('#/');
        return;
    }
    const prev = currentRoute;
    currentRoute = route;

    if (route.page === 'home') {
        stopStory();
        watchTimer.stop();
        clearInterval(ctaTicker);
        renderHome();
    } else if (prev.page !== route.page) {
        const render = () => {
            renderCase(route.page, route.tab);
            window.scrollTo(0, 0);
            contentContainer.classList.remove('scene-enter');
            void contentContainer.offsetWidth;
            contentContainer.classList.add('scene-enter');
        };
        // 首次載入（重新整理）直接回到原本位置，不播轉場
        prev.page === null ? render() : playTransit(route.page, render);
    } else {
        renderCase(route.page, route.tab);
    }
}
window.addEventListener('hashchange', router);

// ═══════════════════════════════════════════════
// 首頁
// ═══════════════════════════════════════════════

function renderHome() {
    const filled = infoFilled();
    const s = state.studentInfo;
    let html = `
        <div class="caution-strip"></div>
        <div class="text-center mb-10 fade-in">
            <h2 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-2">警鐘長鳴：大型事故的風險解構</h2>
            <p class="text-lg sm:text-xl text-gray-600">運用「骨牌理論」與「三段五級預防」分析真實案例，學習成為安全守護者。</p>
        </div>
    `;

    if (!filled) {
        html += `
        <form id="info-form" class="bg-red-50 border-2 border-red-400 rounded-xl p-6 mb-8 fade-in">
            <h3 class="text-xl font-bold text-red-600 mb-4 flex items-center">
                <i data-lucide="user-check" class="w-6 h-6 mr-2"></i>
                請先填寫你的資料，才能開始分析
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="input-class" class="block text-sm font-semibold text-gray-700 mb-1">班級</label>
                    <select id="input-class" class="w-full border border-gray-300 rounded-lg p-2 text-gray-800">
                        <option value="">-- 選擇班級 --</option>
                        ${['301','302','303','304','305','306','307','308','309','310','311','312'].map(c => `<option value="${c}" ${s.class_name === c ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label for="input-seat" class="block text-sm font-semibold text-gray-700 mb-1">座號</label>
                    <input id="input-seat" type="number" min="1" max="50" placeholder="例：12" value="${esc(s.seat)}"
                        class="w-full border border-gray-300 rounded-lg p-2 text-gray-800">
                </div>
                <div>
                    <label for="input-name" class="block text-sm font-semibold text-gray-700 mb-1">姓名</label>
                    <input id="input-name" type="text" placeholder="請輸入真實姓名" value="${esc(s.name)}"
                        class="w-full border border-gray-300 rounded-lg p-2 text-gray-800">
                </div>
            </div>
            <button type="submit"
                class="mt-4 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-full transition shadow-md">
                確認身份，開始學習
            </button>
        </form>
        `;
    } else {
        html += `
        <div class="bg-green-50 border border-green-300 rounded-xl p-4 mb-8 flex flex-wrap gap-2 items-center justify-between fade-in">
            <span class="text-green-700 font-semibold flex items-center">
                <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
                歡迎，${esc(s.class_name)}班 第${esc(s.seat)}號 <strong class="ml-1">${esc(s.name)}</strong>！你的作答會自動存在這台裝置上。
            </span>
            <button data-action="reset-student" class="text-sm text-gray-400 hover:text-red-500 underline">換人作答（清除本機資料）</button>
        </div>
        `;
    }

    html += `
        <a href="timeline.html" class="block mb-8 rounded-xl overflow-hidden relative text-white shadow-xl group" style="background:linear-gradient(120deg,#0b1d2a,#1d4e5f 55%,#c9a45c)">
            <div class="p-6 sm:p-8 relative">
                <div class="text-xs tracking-[.4em] text-yellow-200 mb-2">THE RIVER OF TIME ・ 3D 試作版</div>
                <div class="text-2xl sm:text-3xl font-bold mb-2">時間之河：沿著年代，航向每一場事故</div>
                <p class="text-sm sm:text-base text-gray-100">搭船穿越時間線，走進八仙、花蓮地震、普悠瑪、太魯閣號、光復堰塞湖的事故現場，親眼看見五張骨牌如何一張張倒下。</p>
                <span class="inline-block mt-4 bg-yellow-300 text-gray-900 font-bold py-2 px-5 rounded-full group-hover:bg-yellow-200">啟程 →</span>
            </div>
        </a>
        <h3 class="text-2xl font-semibold text-red-500 mb-6 border-b-2 border-red-200 pb-2">選擇一扇門，走進事故現場</h3>
        <div class="door-grid grid grid-cols-1 md:grid-cols-2 gap-6">
    `;

    Object.keys(cases).forEach(key => {
        const c = cases[key];
        const p = caseProgress(key);
        const started = p.revealed || p.answered || p.simAnswered || (state.storySeen[key] ?? -1) >= 0;
        html += `
            <a ${filled ? `href="#/${key}/story"` : 'href="#/" data-action="need-info"'}
                class="door-card ${filled ? 'open cursor-pointer' : 'cursor-not-allowed opacity-60'} block bg-white p-6 border-2 border-gray-200 rounded-xl shadow-xl">
                <div class="door-light"></div>
                <div class="flex items-center mb-4">
                    <i data-lucide="${c.icon}" class="w-10 h-10 text-red-500 mr-4 shrink-0"></i>
                    <div>
                        <span class="text-xs font-bold text-red-500 tracking-widest">${c.year}</span>
                        <h4 class="text-xl font-bold text-gray-800">${c.title}</h4>
                    </div>
                </div>
                <p class="text-gray-600 text-sm">${c.summary}</p>
                ${filled ? `
                <div class="mt-4 flex flex-wrap gap-2 text-xs">
                    <span class="px-2 py-1 rounded-full ${p.storyDone ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">故事 ${p.storyDone ? '✓' : '—'}</span>
                    <span class="px-2 py-1 rounded-full ${p.simAnswered === p.simTotal ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">模擬 ${p.simAnswered}/${p.simTotal}</span>
                    <span class="px-2 py-1 rounded-full ${p.revealed === 5 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">骨牌 ${p.revealed}/5</span>
                    <span class="px-2 py-1 rounded-full ${p.answered === 5 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">配對 ${p.answered}/5</span>
                    ${p.submitted ? '<span class="px-2 py-1 rounded-full bg-green-500 text-white">已送出</span>' : ''}
                </div>` : ''}
                <span class="mt-4 inline-block text-sm text-red-500 font-semibold">${filled ? (started ? '繼續上次進度 →' : '推開這扇門 →') : '請先填寫資料'}</span>
            </a>
        `;
    });

    html += `</div>`;
    contentContainer.innerHTML = html;
    contentContainer.classList.remove('scene-enter');
    icons();
}

function saveStudentInfo() {
    const cls = document.getElementById('input-class')?.value;
    const seat = document.getElementById('input-seat')?.value?.trim();
    const name = document.getElementById('input-name')?.value?.trim();

    if (!cls || !seat || !name) {
        toast('請完整填寫班級、座號與姓名！');
        return;
    }
    const seatNum = Number(seat);
    if (!Number.isInteger(seatNum) || seatNum < 1 || seatNum > 50) {
        toast('座號請填 1 到 50 的整數');
        return;
    }
    state.studentInfo = { class_name: cls, seat: String(seatNum), name: name };
    saveState();
    let pending = null;
    try { pending = sessionStorage.getItem('sg_pending'); sessionStorage.removeItem('sg_pending'); } catch (_) {}
    if (pending && pending !== '#/') { location.hash = pending; return; }
    renderHome();
}

function resetStudentInfo() {
    if (!confirm('確定要換人作答嗎？\n這台裝置上的姓名與所有作答紀錄都會被清除。')) return;
    state = emptyState();
    watchLog.clear();
    try { localStorage.removeItem('sg_teacher'); } catch (_) {}   // 換人時一併關閉老師模式
    document.getElementById('teacher-badge')?.remove();
    saveState(false);
    renderHome();
}

// ═══════════════════════════════════════════════
// 案例分析頁
// ═══════════════════════════════════════════════
function caseProgress(caseKey) {
    const d = state.dominoState[caseKey] || { inputs: {}, revealed: {} };
    const revealed = Object.values(d.revealed || {}).filter(Boolean).length;
    const answered = Object.keys(state.quizResults[caseKey] || {}).length;
    const sd = storyData[caseKey];
    const storyDone = watchLog.unlocked(caseKey);
    const simAnswered = Object.keys(state.simResults[caseKey] || {}).length;
    const sub = state.submissions[caseKey];
    return { revealed, answered, storyDone, simAnswered, simTotal: sd.sim.length, submitted: sub && sub.status === 'done' };
}

function renderCase(caseKey, tab) {
    stopStory();
    if (!state.quizResults[caseKey]) state.quizResults[caseKey] = {};
    const c = cases[caseKey];
    const p = caseProgress(caseKey);
    const steps = [
        { key: 'story', label: '事故故事', done: p.storyDone },
        { key: 'sim', label: '現場模擬', done: p.simAnswered === p.simTotal },
        { key: 'domino', label: '骨牌理論', done: p.revealed === 5 },
        { key: 'prevention', label: '三段五級', done: p.answered === c.prevention.length },
        { key: 'report', label: '分析報告', done: p.submitted },
    ];
    const isAnalysis = ['domino', 'prevention', 'report'].includes(tab);
    const locked = !watchLog.unlocked(caseKey);   // 還沒看完故事：分析分頁先鎖住

    contentContainer.innerHTML = `

        </div>

        <nav class="stepper flex flex-wrap border-b mb-6 gap-1">
            ${steps.map((st, i) => `
            <a href="#/${caseKey}/${st.key}" class="${st.done ? 'done' : ''} py-3 px-3 sm:px-4 text-base sm:text-lg font-semibold border-b-4 transition duration-150 ${st.key === tab
                ? 'border-red-500 text-red-600'

                <span class="num">${st.done ? '✓' : (locked && i > 0 ? '🔒' : i + 1)}</span>${st.label}
            </a>`).join('')}
        </nav>

        <div id="analysis-content" class="fade-in"></div>
    `;

    if (tab === 'story') renderStory(caseKey);

    else if (tab === 'domino') renderDomino(caseKey);
    else if (tab === 'prevention') renderPrevention(caseKey);
    else renderSynthesisReport(caseKey);
    icons();
}

const FX_ICON = { calm: 'sun', spin: 'ferris-wheel', spinfast: 'gauge', impact: 'alert-octagon', powder: 'cloud', fire: 'flame',
    siren: 'siren', hospital: 'hospital', dark: 'heart-crack', court: 'gavel', shake: 'activity', rubble: 'building-2' };

function particlesHtml(fx) {
    const rnd = (a, b) => a + Math.random() * (b - a);
    let out = '';
    if (fx === 'powder') {
        const colors = ['#f472b6', '#facc15', '#60a5fa', '#34d399', '#c084fc', '#fb923c'];
        for (let i = 0; i < 34; i++) {
            const size = rnd(30, 90);
            out += `<span style="left:${rnd(-5, 95)}%;bottom:${rnd(-10, 40)}%;width:${size}px;height:${size}px;background:${colors[i % colors.length]};filter:blur(${rnd(6, 16)}px);--dx:${rnd(-80, 80)}px;animation:drift ${rnd(3, 6)}s ${rnd(0, 3)}s ease-out infinite"></span>`;
        }
    } else if (fx === 'fire') {
        for (let i = 0; i < 40; i++) {
            const size = rnd(4, 10);
            out += `<span style="left:${rnd(0, 100)}%;bottom:${rnd(-5, 20)}%;width:${size}px;height:${size}px;background:${i % 2 ? '#fde047' : '#fb923c'};box-shadow:0 0 8px #f97316;animation:rise ${rnd(1.5, 3.5)}s ${rnd(0, 2)}s linear infinite"></span>`;
        }
    } else if (fx === 'rubble' || fx === 'shake') {
        const n = fx === 'rubble' ? 26 : 12;
        for (let i = 0; i < n; i++) {
            const size = rnd(4, 14);
            out += `<span style="left:${rnd(0, 100)}%;top:0;width:${size}px;height:${size}px;border-radius:2px;background:#a8a29e;animation:fall ${rnd(1.5, 3)}s ${rnd(0, 2.5)}s ease-in infinite"></span>`;
        }
    } else if (fx === 'calm' || fx === 'spin') {
        const colors = ['#fde68a', '#f9a8d4', '#a5f3fc'];
        for (let i = 0; i < 18; i++) {
            const size = rnd(3, 7);
            out += `<span style="left:${rnd(0, 100)}%;bottom:${rnd(0, 30)}%;width:${size}px;height:${size}px;background:${colors[i % 3]};animation:rise ${rnd(4, 8)}s ${rnd(0, 4)}s linear infinite"></span>`;
        }
    }
    return out;
}

function stageHtml(fx, icon, caption = '') {
    return `
        <div class="stage fx-${fx}">
            <div class="sky"></div>
            <div class="ground"></div>
            <div class="particles">${reduceMotion ? '' : particlesHtml(fx)}</div>
            <div class="hero"><i data-lucide="${icon}"></i></div>

}

function showChapter(caseKey, i) {
    const sd = storyData[caseKey];
    const ch = sd.chapters[i];
    story.index = i;
    if ((state.storySeen[caseKey] ?? -1) < i) { state.storySeen[caseKey] = i; saveState(false); }

    if (!stageEl) return;
    stageEl.innerHTML = stageHtml(ch.fx, ch.icon, `

        sd.chapters.map((c, k) => `

function setPlaying(on) {
    story.playing = on;

// 選項順序固定打亂（同一題每次順序相同），避免正確答案永遠在同一個位置
function simOrder(caseKey, si, n) {
    let seed = 7;
    for (const ch of `${caseKey}-${si}`) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 16) / 65536; };
    const order = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return order;
}

function simItemHtml(caseKey, si) {
    const q = storyData[caseKey].sim[si];
    const r = (state.simResults[caseKey] || {})[si];
    const order = simOrder(caseKey, si, q.options.length);
    const chosen = r ? q.options[r.choice] : null;
    const right = q.options.find(o => o.correct);
    return `
        ${stageHtml(q.fx, FX_ICON[q.fx] || 'alert-triangle', `
            <div class="caption"><span class="time">情境 ${si + 1}</span><p class="font-semibold text-white">${q.scene}</p></div>`)}
        <div class="p-4 sm:p-5 bg-white space-y-3">
            ${order.map(oi => {
                const o = q.options[oi];
                let cls = '';
                if (r) cls = o.correct ? 'right' : (oi === r.choice ? 'wrong' : 'opacity-60');
                return `<button data-action="sim" data-case="${caseKey}" data-index="${si}" data-opt="${oi}" ${r ? 'disabled' : ''} class="sim-opt ${cls}">
                    ${r && o.correct ? '✓ ' : ''}${r && oi === r.choice && !o.correct ? '✗ ' : ''}${o.text}</button>`;
            }).join('')}
            ${r ? `
            <div class="fade-in p-3 rounded-lg ${r.correct ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                <strong>${r.correct ? '做得好！' : '危險！'}</strong>${chosen.why}
                ${r.correct ? '' : `<div class="mt-2 text-green-800"><strong>正確做法：</strong>${right.text}。${right.why}</div>`}
            </div>` : ''}
        </div>`;
}

function renderSim(caseKey) {
    const sd = storyData[caseKey];
    const res = state.simResults[caseKey] || {};
    const done = Object.keys(res).length;
    const correct = Object.values(res).filter(r => r.correct).length;
    document.getElementById('analysis-content').innerHTML = `
        <h3 class="text-2xl sm:text-3xl font-bold text-gray-700 mb-2 flex items-center">
            <i data-lucide="gamepad-2" class="w-8 h-8 mr-3 text-red-500"></i>
            第二步：現場模擬 — 如果你在現場
        </h3>
        <p class="text-gray-600 mb-6">每個情境只有一次選擇機會，想清楚再按！</p>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${sd.sim.map((_, si) => `<div id="sim-item-${si}" class="sim-card">${simItemHtml(caseKey, si)}</div>`).join('')}
        </div>
        <div id="sim-summary" class="${done === sd.sim.length ? '' : 'hidden'} mt-8 p-5 rounded-xl bg-gray-900 text-white text-center fade-in">
            <p class="text-lg font-bold mb-3">現場模擬完成：${correct} / ${sd.sim.length} 個情境做出安全的選擇</p>
            <a href="#/${caseKey}/domino" class="inline-flex items-center bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg">
                <i data-lucide="dice-5" class="w-5 h-5 mr-2"></i>接下來，用骨牌理論分析這起事故 →
            </a>
        </div>
    `;
}

function answerSim(caseKey, si, oi) {
    const res = state.simResults[caseKey] || (state.simResults[caseKey] = {});
    if (res[si]) return;
    const q = storyData[caseKey].sim[si];
    res[si] = { choice: oi, correct: !!q.options[oi].correct };
    saveState();
    const el = document.getElementById(`sim-item-${si}`);
    if (el) {
        el.innerHTML = simItemHtml(caseKey, si);
        el.classList.remove('knock'); void el.offsetWidth; el.classList.add('knock');
    }
    if (Object.keys(res).length === storyData[caseKey].sim.length) {
        renderSim(caseKey);
        document.getElementById('sim-summary')?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    }
    icons();
}

                <p class="font-bold ${finished ? 'text-green-700' : 'text-gray-700'}">${finished ? `✓ 這一關完成了！（${done}/${total}）` : `進度：${done}/${total} ${cfg.unit}已${cfg.todo}`}</p>
                <p class="text-sm text-gray-500 mt-1">你的作答會自動儲存，不需要另外按儲存。${finished ? '' : `還有 ${total - done} ${cfg.unit}要${cfg.todo}。`}</p>
            </div>
            <a href="#/${caseKey}/${cfg.next}" class="inline-flex items-center font-bold py-3 px-6 rounded-full shadow transition ${finished

        </div>`;
    if (finished) setTimeout(() => el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }), 700);
}

function revealDominoAnswer(caseKey, index) {
    const ds = getDomino(caseKey);
    const inputEl = document.getElementById(`student-domino-input-${index}`);
    if (inputEl) ds.inputs[index] = inputEl.value;
    if (!(ds.inputs[index] || '').trim() &&
        !confirm('你還沒寫下自己的想法喔！\n看完官方分析後就不能再修改這一格，確定要直接看嗎？')) return;

    ds.revealed[index] = true;
    saveState();

    document.getElementById(`prompt-${index}`)?.classList.add('hidden');
    document.getElementById(`answer-${index}`)?.classList.remove('hidden');
    if (inputEl) { inputEl.disabled = true; inputEl.classList.replace('bg-white', 'bg-gray-100'); }
    const card = document.getElementById(`domino-item-${index}`);
    if (card) { card.classList.remove('knock'); void card.offsetWidth; card.classList.add('knock'); }
    document.getElementById(`tile-${index}`)?.classList.add('fallen');
    if ([0, 1, 2, 3, 4].every(i => ds.revealed[i])) {
        setTimeout(() => document.getElementById('chain-msg')?.classList.remove('hidden'), 600);
    }
    updateNextStep(caseKey, 'domino');
}

// ═══════════════════════════════════════════════
// 第二部分：三段五級
// ═══════════════════════════════════════════════
function getRandomWrongLevel(correctLevel) {
    const wrong = ALL_LEVELS.filter(l => l !== correctLevel).sort(() => Math.random() - 0.5);
    return wrong.slice(0, 2);
}

function getPreventionOptions(caseKey) {
    const c = cases[caseKey];
    let opts = state.preventionOptions[caseKey];
    const valid = Array.isArray(opts) && opts.length === c.prevention.length &&
        opts.every((o, i) => Array.isArray(o) && o.includes(c.prevention[i].level));
    if (!valid) {
        // 只產生一次亂序選項並存起來，之後切換 Tab 或重新整理都不會重新洗牌
        opts = c.prevention.map(p => [p.level, ...getRandomWrongLevel(p.level)].sort(() => Math.random() - 0.5));
        state.preventionOptions[caseKey] = opts;
        saveState(false);
    }
    return opts;
}

function optionButtonClass(opt, r) {
    if (!r) return 'bg-white text-gray-700 border border-gray-300 hover:bg-red-100';
    if (opt === r.selected) return `${r.isCorrect ? 'bg-green-500' : 'bg-red-500'} text-white border border-transparent`;
    if (opt === r.correct) return 'bg-green-200 text-gray-700 border border-green-600';
    return 'bg-white text-gray-400 border border-gray-200';
}

function feedbackHtml(r) {
    return r.isCorrect
        ? `<div class="mt-3 ml-9 text-sm font-semibold p-2 rounded-lg bg-green-100 text-green-700">✓ 正確！措施屬於「${r.correct}」。</div>`
        : `<div class="mt-3 ml-9 text-sm font-semibold p-2 rounded-lg bg-red-100 text-red-700">✗ 再想想！正確答案是：<span class="text-green-700 font-bold">${r.correct}</span></div>`;
}

function preventionItemHtml(caseKey, index) {
    const p = cases[caseKey].prevention[index];
    const options = getPreventionOptions(caseKey)[index];
    const r = (state.quizResults[caseKey] || {})[index];
    let stageIcon = 'check-circle';
    if (p.tag === 'stage-2') stageIcon = 'timer';
    if (p.tag === 'stage-3') stageIcon = 'repeat-2';
    return `
        <div class="flex flex-wrap items-center mb-2">
            <i data-lucide="${stageIcon}" class="w-6 h-6 mr-3 text-red-600"></i>
            <span class="text-sm font-semibold text-gray-500 mr-2">${p.stage}</span>
            <span class="text-lg font-extrabold text-gray-800">判斷級別：</span>
        </div>
        <p class="text-gray-700 mt-2 ml-9 font-bold">措施：${p.action}</p>
        <div class="mt-4 ml-9 grid grid-cols-1 md:grid-cols-3 gap-3">
            ${options.map((opt, oi) => `
                <button data-action="answer" data-case="${caseKey}" data-index="${index}" data-opt="${oi}" ${r ? 'disabled' : ''}
                    class="${optionButtonClass(opt, r)} py-2 px-4 rounded-full text-sm transition shadow-sm">
                    ${opt}
                </button>
            `).join('')}
        </div>
        ${r ? feedbackHtml(r) : ''}
    `;
}

function renderPrevention(caseKey) {
    const c = cases[caseKey];
    let html = `
        <h3 class="text-2xl sm:text-3xl font-bold text-gray-700 mb-6 flex items-center">
            <i data-lucide="shield-half" class="w-8 h-8 mr-3 text-green-600"></i>
            第四步：三段五級預防 — 評估防護措施的時間點
        </h3>
        <p class="text-gray-600 mb-8 font-medium bg-gray-100 p-4 rounded-lg border-l-4 border-gray-400">
            <strong>學習引導：</strong>請將每項措施與它對應的「預防級別」配對。
        </p>
        <div class="grid grid-cols-1 gap-6">
    `;
    c.prevention.forEach((p, index) => {
        html += `<div id="prevention-item-${index}" class="${p.tag} p-5 rounded-xl border-l-8 shadow-lg transition duration-300">${preventionItemHtml(caseKey, index)}</div>`;

}

function checkPreventionAnswer(caseKey, index, optIndex) {
    const results = state.quizResults[caseKey] || (state.quizResults[caseKey] = {});
    if (results[index]) return; // 已作答，不可重複點
    const selected = getPreventionOptions(caseKey)[index][optIndex];
    const correct = cases[caseKey].prevention[index].level;
    results[index] = { selected, correct, isCorrect: selected === correct };
    saveState();
    const item = document.getElementById(`prevention-item-${index}`);
    if (item) {
        item.innerHTML = preventionItemHtml(caseKey, index);
        item.classList.remove('knock'); void item.offsetWidth; item.classList.add('knock');
        icons();
    }
    updateNextStep(caseKey, 'prevention');
}

function buildPayload(caseKey) {
    const c = cases[caseKey];
    const ds = getDomino(caseKey);
    const results = state.quizResults[caseKey] || {};
    const dominoInputs = {};
    for (let i = 0; i < 5; i++) dominoInputs[i] = ds.inputs[i] || '';
    return {
        class_name: state.studentInfo.class_name,
        seat: state.studentInfo.seat,
        name: state.studentInfo.name,
        case_title: c.title,
        domino_inputs: dominoInputs,
        prevention_results: results,
        score: Object.values(results).filter(r => r.isCorrect).length,
        total: c.prevention.length,
        // 以下為新版欄位（舊版後台會自動忽略）
        case_key: caseKey,
        ...simSummary(caseKey),
        watch_text: watchLog.text(caseKey)
    };
}

function simSummary(caseKey) {
    const qs = storyData[caseKey].sim, res = state.simResults[caseKey] || {};
    return {
        sim_score: Object.values(res).filter(r => r.correct).length,
        sim_total: qs.length,
        sim_text: qs.map((q, i) => {
            const r = res[i];
            return `情境${i + 1}：${r ? q.options[r.choice].text + (r.correct ? ' ✓' : ' ✗') : '未作答'}`;
        }).join('\n')
    };
}

function renderSubmitPanel(caseKey) {
    const el = document.getElementById('ai-feedback-content');
    if (!el || currentRoute.page !== caseKey || currentRoute.tab !== 'report') return;
    const sub = state.submissions[caseKey] || { status: 'none' };
    const downloadBtn = `
        <button data-action="download" data-case="${caseKey}"
            class="bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 font-semibold py-2 px-5 rounded-full transition flex items-center">
            <i data-lucide="download" class="w-4 h-4 mr-2"></i>下載我的學習記錄（備份）
        </button>`;
    const submitBtn = (label, cls = 'bg-red-500 hover:bg-red-600 text-white') => `
        <button data-action="submit" data-case="${caseKey}"
            class="${cls} font-bold py-3 px-8 rounded-full transition shadow-lg flex items-center">

        <div class="flex items-center text-gray-500">

                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>${msg}
        </div>`;

    let html = '';
    switch (sub.status) {
        case 'sending':
            html = spinner('正在送出資料…');

        case 'pending':
            html = spinner('資料已送達！正在生成個人化回饋，請稍候（離開此頁或重新整理也沒關係，回來會自動接著查）…');
            break;

            html = `
                <div class="fade-in">

                    </div>

            break;
        case 'error':
            html = `
                <div class="bg-red-100 text-red-700 p-4 rounded-lg mb-4">
                    <strong>回饋生成失敗：</strong>${esc(sub.error || '未知錯誤')}<br>

                </div>
                <div class="flex flex-wrap gap-3">
                    <button data-action="repoll" data-case="${caseKey}" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full transition shadow-lg">繼續查詢回饋</button>

                <p class="text-xs text-gray-400 mt-2">送出後會產生學習回饋，並把你的學習記錄交給老師。</p>`;
    }
    el.innerHTML = html;
    icons();
}

async function submitToBackend(caseKey) {
    const cur = state.submissions[caseKey];
    if (cur && (cur.status === 'sending' || cur.status === 'pending')) return; // 防止連點重複送出

    // 送出前把畫面上的文字也寫進 state
    document.querySelectorAll('.domino-input').forEach(el => {
        getDomino(el.dataset.case).inputs[el.dataset.index] = el.value;
    });
    const data = buildPayload(caseKey);
    state.submissions[caseKey] = { status: 'sending', submittedAt: Date.now() };
    saveState(false);
    renderSubmitPanel(caseKey);

    try {
        const url = getBackendUrl();
        // Google Apps Script 後台：直接回傳回饋，不需要輪詢
        const isAppsScript = /script\.google(usercontent)?\.com/.test(url);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), isAppsScript ? 60000 : 20000);
        let res;
        try {
            res = await fetch(isAppsScript ? url : `${url}/api/submit`, {
                method: 'POST',
                // Apps Script 用 text/plain 送出，才不會被瀏覽器的跨網域檢查擋下
                headers: { 'Content-Type': isAppsScript ? 'text/plain;charset=utf-8' : 'application/json' },
                body: JSON.stringify(data),
                signal: controller.signal
            });
        } finally { clearTimeout(timer); }

        if (!res.ok) throw new Error(`伺服器錯誤 ${res.status}`);
        const json = await res.json();
        if (isAppsScript) {
            if (json.status !== 'done') throw new Error(json.error || '後台處理失敗');
            state.submissions[caseKey] = { status: 'done', id: json.id, feedback: json.feedback || '', submittedAt: Date.now() };
            saveState();
            renderSubmitPanel(caseKey);
            return;
        }
        const { id } = json;
        if (!id) throw new Error('伺服器沒有回傳記錄編號');

        state.submissions[caseKey] = { status: 'pending', id, submittedAt: Date.now() };
        saveState();
        renderSubmitPanel(caseKey);
        pollForFeedback(caseKey);
    } catch (err) {
        const msg = err.name === 'AbortError' ? '等候逾時（後端沒有回應）'
            : (err instanceof TypeError ? '無法連線到後端（可能尚未啟動或網址已更換）' : err.message);
        state.submissions[caseKey] = { status: 'failed', error: msg };
        saveState(false);
        renderSubmitPanel(caseKey);
    }
}

const activePolls = new Set();
async function pollForFeedback(caseKey) {
    if (activePolls.has(caseKey)) return;
    activePolls.add(caseKey);
    try {
        const maxAttempts = 60; // 每 2 秒一次，最多等 2 分鐘
        for (let i = 0; i < maxAttempts; i++) {
            await sleep(2000);
            const sub = state.submissions[caseKey];
            if (!sub || sub.status !== 'pending' || !sub.id) return;
            try {
                const res = await fetch(`${getBackendUrl()}/api/status/${encodeURIComponent(sub.id)}`);
                if (!res.ok) continue;
                const json = await res.json();
                if (json.status === 'done') {
                    state.submissions[caseKey] = { ...sub, status: 'done', feedback: json.feedback || '' };
                    saveState();
                    renderSubmitPanel(caseKey);
                    if (currentRoute.page !== caseKey || currentRoute.tab !== 'report') toast(`「${cases[caseKey].title}」的學習回饋已完成！`);
                    return;
                } else if (json.status === 'error') {
                    state.submissions[caseKey] = { ...sub, status: 'error', error: json.error || '未知錯誤' };
                    saveState(false);
                    renderSubmitPanel(caseKey);
                    return;
                }
            } catch (_) { /* 網路抖動，繼續輪詢 */ }
        }
        const sub = state.submissions[caseKey];
        if (sub && sub.status === 'pending') {
            state.submissions[caseKey] = { ...sub, status: 'timeout' };
            saveState(false);
            renderSubmitPanel(caseKey);
        }
    } finally {
        activePolls.delete(caseKey);
    }
}

function downloadRecord(caseKey) {
    const d = buildPayload(caseKey);
    const c = cases[caseKey];
    const lines = [
        '事故現場・安全守護者 學習記錄',
        `班級：${d.class_name}　座號：${d.seat}　姓名：${d.name}`,
        `案例：${d.case_title}`,
        `事故故事：${watchLog.text(caseKey)}`,
        `下載時間：${new Date().toLocaleString('zh-TW')}`,
        '',
        '【現場模擬】',
        ...storyData[caseKey].sim.map((q, i) => {
            const r = (state.simResults[caseKey] || {})[i];
            return `${i + 1}. ${q.scene}\n   我的選擇：${r ? q.options[r.choice].text : '未作答'}　${r ? (r.correct ? '✓' : '✗') : '—'}`;
        }),
        '',
        '【骨牌理論】',
        ...c.domino.map((dm, i) => `${i + 1}. ${dm.name}\n   我的分析：${d.domino_inputs[i] || '（未填寫）'}\n   官方分析：${dm.factor}`),
        '',
        `【三段五級】得分 ${d.score}/${d.total}`,
        ...c.prevention.map((p, i) => {
            const r = d.prevention_results[i];
            return `${i + 1}. ${p.action}\n   我的選擇：${r ? r.selected : '未作答'}　正確級別：${p.level}　${r ? (r.isCorrect ? '✓' : '✗') : '—'}`;
        })
    ];
    const sub = state.submissions[caseKey];
    if (sub && sub.status === 'done' && sub.feedback) lines.push('', '【學習回饋】', sub.feedback);

    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${d.class_name}-${d.seat}-${d.name}-${d.case_title}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ═══════════════════════════════════════════════
// 事件（統一用 data-action 處理，不再把文字塞進 onclick 裡）
// ═══════════════════════════════════════════════
document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const { action, case: ck, index, opt } = el.dataset;
    switch (action) {
        case 'need-info': e.preventDefault(); toast('請先填寫班級、座號、姓名！'); document.getElementById('input-class')?.focus(); break;
        case 'reveal': revealDominoAnswer(ck, Number(index)); break;
        case 'sim': answerSim(ck, Number(index), Number(opt)); break;
        case 'story-go': setPlaying(false); showChapter(story.caseKey, Number(index)); break;
        case 'story-prev': setPlaying(false); if (story.index > 0) showChapter(story.caseKey, story.index - 1); break;
        case 'story-next': setPlaying(false); if (story.index < storyData[story.caseKey].chapters.length - 1) showChapter(story.caseKey, story.index + 1); break;
        case 'story-play': {
            const last = storyData[story.caseKey].chapters.length - 1;
            if (story.playing) { setPlaying(false); break; }
            setPlaying(true);
            showChapter(story.caseKey, story.index >= last ? 0 : story.index);
            break;
        }
        case 'answer': checkPreventionAnswer(ck, Number(index), Number(opt)); break;
        case 'submit': submitToBackend(ck); break;
        case 'resubmit':
            if (confirm('確定要重新送出嗎？老師那邊會多一份新的記錄。')) {
                state.submissions[ck] = { status: 'none' };
                submitToBackend(ck);
            }
            break;
        case 'repoll':
            state.submissions[ck] = { ...state.submissions[ck], status: 'pending' };
            saveState(false);
            renderSubmitPanel(ck);
            pollForFeedback(ck);
            break;
        case 'download': downloadRecord(ck); break;
        case 'reset-student': resetStudentInfo(); break;
        case 'enter-maze': enterMaze(); break;
        case 'skip-intro': hideOverlay(); break;
        case 'replay-intro': showIntro(); break;
    }
});

document.addEventListener('input', e => {
    const el = e.target;
    if (el.classList.contains('domino-input')) {
        getDomino(el.dataset.case).inputs[el.dataset.index] = el.value;
        saveStateDebounced();
    }
});

document.addEventListener('submit', e => {
    if (e.target.id === 'info-form') { e.preventDefault(); saveStudentInfo(); }
});

// ═══════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════
// 從 3D 時間之河過來：網址可能是「#taroko.sim」，或網址被清掉時改讀本機暫存的目的地
(function consumeGoto() {
    let saved = null;
    try { saved = localStorage.getItem('sg_goto'); localStorage.removeItem('sg_goto'); } catch (_) {}
    const m = location.hash.match(/^#([a-z0-9]+)\.(story|sim|domino|prevention|report)$/);
    const target = m ? `#/${m[1]}/${m[2]}` : (!location.hash || location.hash === '#/' ? saved : null);
    if (target) { try { history.replaceState(null, '', target); } catch (_) { location.hash = target; } }
})();
router();
icons();
let introSeen = false;
try { introSeen = sessionStorage.getItem('sg_intro_seen') === '1'; } catch (_) {}
if (!introSeen && currentRoute.page === 'home') showIntro();
</script>
