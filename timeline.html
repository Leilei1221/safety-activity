<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間之河｜事故現場・安全守護者</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f5d48a; --ink: #05070d; --bar: 7vh; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; overflow: hidden;
            font-family: 'Noto Serif TC', serif; -webkit-font-smoothing: antialiased; }
        canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

        /* 電影黑邊 */
        .bar { position: fixed; left: 0; right: 0; height: var(--bar); background: #000; z-index: 5; pointer-events: none; }
        .bar.top { top: 0; } .bar.bottom { bottom: 0; }

        /* 片頭字卡 */
        #title-card { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 16px; transition: opacity 1.2s ease; pointer-events: none; }
        #title-card.gone { opacity: 0; }
        #title-card .en { font-family: 'Cormorant Garamond', serif; letter-spacing: .5em; font-size: clamp(.8rem, 2vw, 1.1rem); color: var(--gold); margin-bottom: .8rem; }
        #title-card::before { content: ''; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(4,8,16,.72), rgba(4,8,16,.35) 60%, transparent 100%); }
        #title-card h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.4rem); font-weight: 700; letter-spacing: .15em; text-shadow: 0 2px 4px rgba(0,0,0,.8), 0 4px 30px rgba(0,0,0,.7); }
        #title-card p { font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; font-style: italic; font-size: clamp(1rem, 2.4vw, 1.35rem); color: #e8eef5; margin: 1rem 0 0; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
        #title-card .start { pointer-events: auto; margin-top: 2rem; }

        /* 字幕 */
        #subtitle { position: fixed; left: 50%; bottom: calc(var(--bar) + 16px); transform: translateX(-50%); z-index: 6;
            width: min(900px, calc(100% - 32px)); text-align: center; pointer-events: none; transition: opacity .6s ease; }
        #subtitle.hide { opacity: 0; }
        #subtitle .kicker { font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; letter-spacing: .3em; font-size: clamp(.72rem, 1.8vw, .9rem); color: var(--gold); }
        #subtitle .kicker::before, #subtitle .kicker::after { content: ''; display: inline-block; width: 36px; height: 1px; background: var(--gold); opacity: .6; vertical-align: middle; margin: 0 12px; }
        #scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 46vh; z-index: 5; pointer-events: none;
            background: linear-gradient(to top, rgba(3,6,12,.88) 0%, rgba(3,6,12,.6) 40%, transparent 100%); }
        .scrim-top { position: fixed; left: 0; right: 0; top: 0; height: 24vh; z-index: 5; pointer-events: none; background: linear-gradient(to bottom, rgba(3,6,12,.7), transparent); }
        #subtitle .line { margin-top: .5rem; font-style: italic; font-size: clamp(1rem, 2.4vw, 1.35rem); line-height: 1.7; color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9); }

        /* 按鈕與控制列 */
        .btn { font-family: inherit; font-size: clamp(.9rem, 2vw, 1rem); color: #fff; background: rgba(10,14,24,.55); border: 1px solid rgba(245,212,138,.55);
            padding: .65rem 1.3rem; border-radius: 9999px; cursor: pointer; backdrop-filter: blur(6px); transition: all .25s; text-decoration: none; display: inline-block; }
        .btn:hover { background: rgba(245,212,138,.18); border-color: var(--gold); }
        .btn.primary { background: rgba(245,212,138,.9); color: #1a1406; border-color: var(--gold); font-weight: 700; }
        .btn.primary:hover { background: #ffe3a3; }
        .btn:disabled { opacity: .35; cursor: default; }
        #actions { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + 138px); z-index: 7;
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: min(900px, calc(100% - 32px)); transition: opacity .5s; }
        #actions:empty { display: none; }
        #topbar { position: fixed; top: calc(var(--bar) + 10px); left: 16px; right: 16px; z-index: 7; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
        #topbar > * { pointer-events: auto; }
        #topbar .btn { padding: .45rem .95rem; font-size: .85rem; }

        /* 時間軸導覽 */
        #timeline { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--bar) + 58px); z-index: 7;
            display: flex; gap: clamp(8px, 3vw, 28px); align-items: center; }
        #timeline { background: rgba(6,10,18,.62); padding: 6px 14px; border-radius: 9999px; backdrop-filter: blur(6px); border: 1px solid rgba(245,212,138,.25); }
        #timeline:empty { display: none; }
        #timeline button { background: none; border: 0; color: rgba(255,255,255,.8); cursor: pointer; font-family: 'Cormorant Garamond', serif; font-size: clamp(.85rem, 2.2vw, 1.05rem); letter-spacing: .1em; padding: 4px; }
        #timeline button .d { display: block; width: 9px; height: 9px; margin: 0 auto 4px; border-radius: 50%; border: 1px solid currentColor; }
        #timeline button.on { color: var(--gold); }
        #timeline button.on .d { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        /* 骨牌選擇 */
        .pick { border-color: rgba(255,255,255,.4); }

        #hud { position: fixed; right: 16px; top: calc(var(--bar) + 64px); z-index: 7; display: flex; align-items: baseline; gap: 8px;
            padding: 10px 16px; border-radius: 14px; background: rgba(6,10,18,.72); border: 1px solid rgba(245,212,138,.35);
            font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; font-variant-numeric: tabular-nums; }
        #hud b { font-size: 2.1rem; line-height: 1; }
        #hud .lab { font-size: .8rem; color: #cbd5e1; }
        #hud .lim { margin-left: 8px; padding: 2px 8px; border-radius: 9999px; border: 2px solid #d62828; background: #fff; color: #111; font-weight: 700; font-size: .85rem; }
        #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .15s; }
        #veil { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 8; transition: opacity 1s ease; }
        #veil.off { opacity: 0; }
        #loading { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; letter-spacing: .4em; color: var(--gold); }
        #fallback { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--ink); }
        #fallback.show { display: flex; }
        #fallback p { line-height: 1.8; color: #d1d5db; }
        @media (max-width: 640px) { :root { --bar: 5vh; } #actions { bottom: calc(var(--bar) + 150px); } }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar top"></div>
<div class="bar bottom"></div>
<div id="flash"></div>

<div id="title-card">
    <div class="en">THE RIVER OF TIME</div>
    <h1>時間之河</h1>
    <p>每一場事故，都是一條沒有被截斷的因果之河。</p>
    <div class="start"><button class="btn primary" id="btn-start">啟程 ▶</button></div>
</div>

<div id="topbar">
    <div style="display:flex;gap:8px"><a class="btn" id="site-link" href="index.html#/">✕ 回到網站</a>
        <button class="btn" id="btn-river" hidden>◀ 回到時間之河</button></div>
    <div style="display:flex;gap:8px">
        <button class="btn" id="btn-music" title="開關背景音樂">♪ 音樂：開</button>
        <button class="btn" id="btn-quality" title="畫面太卡時可切換">畫質：高</button>

        <h2 style="font-weight:700;letter-spacing:.1em">這台裝置無法順利播放 3D 動畫</h2>
        <p>可能是瀏覽器不支援 WebGL，或網路無法載入 3D 元件。<br>別擔心，平面版的內容完全相同。</p>
        <a class="btn primary" href="index.html#/">前往平面版 →</a>
    </div>
</div>

<script src="cases.js"></script>
<script>
    // 20 秒內 3D 沒啟動（例如 CDN 被擋）→ 顯示平面版連結
    window.__timelineFail = function () { document.getElementById('fallback').classList.add('show'); };
    setTimeout(function () { if (!window.__timelineReady) window.__timelineFail(); }, 20000);
    (function () {
        try {
            var cv = document.createElement('canvas');
            if (!(cv.getContext('webgl2') || cv.getContext('webgl'))) window.__timelineFail();
        } catch (e) { window.__timelineFail(); }
    })();

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ═══════════════════════════════════════════════
// 基本設定
// ═══════════════════════════════════════════════
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSmall = Math.min(innerWidth, innerHeight) < 700;
let quality = (() => {
    try { const q = localStorage.getItem('sg_3d_quality'); if (q) return q; } catch (_) {}
    return (isSmall || (navigator.hardwareConcurrency || 8) <= 4) ? 'low' : 'high';
})();

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 6000);
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(new THREE.Scene(), camera);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.3, 3.2); // 門檻設高：只讓燈光發光，不讓天空泛白
composer.addPass(renderPass);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function applyQuality() {
    const dpr = Math.min(devicePixelRatio, quality === 'high' ? 2 : 1);
    renderer.setPixelRatio(dpr);
    renderer.setSize(innerWidth, innerHeight, false);
    composer.setPixelRatio(dpr);
    composer.setSize(innerWidth, innerHeight);
    bloom.enabled = quality === 'high';
    $('btn-quality').textContent = `畫質：${quality === 'high' ? '高' : '省電'}`;
}
applyQuality();
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    applyQuality();
});
$('btn-quality').onclick = () => {
    quality = quality === 'high' ? 'low' : 'high';
    try { localStorage.setItem('sg_3d_quality', quality); } catch (_) {}
    location.reload(); // 水面反射等物件需重建
};

// ═══════════════════════════════════════════════
// 共用小工具
// ═══════════════════════════════════════════════
const tweens = new Set();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(duration, fn, easing = ease) {
    if (reduceMotion) duration = Math.min(duration, 0.01);
    return new Promise(resolve => tweens.add({ t: 0, duration, fn, easing, resolve }));
}
const wait = s => tween(s, () => {});
function stepTweens(dt) {
    for (const tw of tweens) {
        tw.t = Math.min(1, tw.t + dt / Math.max(tw.duration, 1e-4));
        tw.fn(tw.easing(tw.t), tw.t);
        if (tw.t >= 1) { tweens.delete(tw); tw.resolve(); }
    }
}

// 攝影機：位置與注視點平滑移動
const camLook = new THREE.Vector3();
let camShake = 0;
function moveCamera(pos, look, duration = 2.5) {
    const p0 = camera.position.clone(), l0 = camLook.clone();
    const p1 = new THREE.Vector3(...pos), l1 = new THREE.Vector3(...look);
    return tween(duration, k => { camera.position.lerpVectors(p0, p1, k); camLook.lerpVectors(l0, l1, k); });
}
function setCamera(pos, look) { camera.position.set(...pos); camLook.set(...look); }

function textTexture(lines, { w = 1024, h = 512, bg = null, glow = '#f5d48a' } = {}) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach(l => {
        g.font = l.font; g.fillStyle = l.color || '#fff';
        g.shadowColor = l.glow === false ? 'transparent' : glow; g.shadowBlur = l.blur ?? 18;
        g.fillText(l.text, w / 2, l.y);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
}

// 可無縫拼接的水波法線貼圖（程式產生，不需外部圖片）
function waterNormalTexture() {
    const N = 256, cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d'), img = g.createImageData(N, N);
    const waves = Array.from({ length: 7 }, (_, i) => ({ kx: Math.round(Math.random() * 6 - 3) || 1, ky: Math.round(Math.random() * 8 + 1), a: 1 / (i + 1), p: Math.random() * 6.28 }));
    const h = (x, y) => waves.reduce((s, w) => s + w.a * Math.sin(2 * Math.PI * (w.kx * x + w.ky * y) / N + w.p), 0);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const dx = h(x + 1, y) - h(x - 1, y), dy = h(x, y + 1) - h(x, y - 1);
        const n = new THREE.Vector3(-dx * 2, -dy * 2, 1).normalize();
        const i = (y * N + x) * 4;
        img.data[i] = (n.x * .5 + .5) * 255; img.data[i + 1] = (n.y * .5 + .5) * 255; img.data[i + 2] = (n.z * .5 + .5) * 255; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function glowTexture(color = '255,240,200') {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${color},1)`); gr.addColorStop(.25, `rgba(${color},.5)`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function mountain(r, h, color, seed = 1) {
    const geo = new THREE.ConeGeometry(r, h, 10, 5);
    const pos = geo.attributes.position;
    let s = seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        if (y < h / 2 - 0.01) {
            const f = 1 - (y + h / 2) / h;
            pos.setX(i, pos.getX(i) * (0.8 + rnd() * 0.4));
            pos.setZ(i, pos.getZ(i) * (0.8 + rnd() * 0.4));
            pos.setY(i, y + (rnd() - .5) * h * 0.08 * f);
        }
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, envMapIntensity: .25 }));
    m.position.y = h / 2 - 2;
    return m;
}

function makeSky(scene, elevation, azimuth, { turbidity = 6, rayleigh = 1.4 } = {}) {
    const sky = new Sky();
    sky.scale.setScalar(5000);
    const u = sky.material.uniforms;
    u.turbidity.value = turbidity; u.rayleigh.value = rayleigh; u.mieCoefficient.value = .005; u.mieDirectionalG.value = .85;
    const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elevation), THREE.MathUtils.degToRad(azimuth));
    u.sunPosition.value.copy(sun);
    scene.add(sky);
    // 以天空產生環境光照
    const pm = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene(); envScene.add(sky.clone());
    scene.environment = pm.fromScene(envScene).texture;
    return sun;
}

function makeWater(scene, size, tint, y = 0) {
    const normal = waterNormalTexture();
    normal.repeat.set(size / 14, size / 14);
    let mirror = null;
    if (quality === 'high') {
        mirror = new Reflector(new THREE.PlaneGeometry(size, size), {
            textureWidth: innerWidth * .6, textureHeight: innerHeight * .6, color: tint, clipBias: 0.003 });
        mirror.rotation.x = -Math.PI / 2; mirror.position.y = y;
        scene.add(mirror);
    }
    const ripple = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({
        color: tint, roughness: .22, metalness: .35, normalMap: normal, normalScale: new THREE.Vector2(.12, .12),
        transparent: !!mirror, opacity: mirror ? .45 : 1 }));
    ripple.rotation.x = -Math.PI / 2; ripple.position.y = y + .02;
    scene.add(ripple);
    return { update: dt => { normal.offset.y -= dt * .02; normal.offset.x += dt * .006; } };
}

const subtitle = $('subtitle');
let runId = 0;   // 每次切換場景就加一，讓被中斷的動畫流程不再改動畫面
async function say(kicker, line) {
    const id = runId;
    subtitle.classList.add('hide');
    await wait(.35);
    if (id !== runId) return;
    subtitle.querySelector('.kicker').textContent = kicker;
    subtitle.querySelector('.line').textContent = line;
    subtitle.style.display = kicker || line ? '' : 'none';
    subtitle.classList.remove('hide');
}
function actions(list) {
    const box = $('actions');
    box.innerHTML = '';
    list.forEach(a => {
        const el = document.createElement(a.href ? 'a' : 'button');
        el.className = 'btn ' + (a.primary ? 'primary' : '') + (a.cls ? ' ' + a.cls : '');
        el.textContent = a.label;
        if (a.disabled) el.disabled = true;
        else if (a.href) el.href = a.href; else el.onclick = a.onClick;
        box.appendChild(el);
    });
}
async function fadeVeil(on) { $('veil').classList.toggle('off', !on); await wait(1); }

// 在平面版的進度中記下「已看完故事」
function markStorySeen(key) {
    try {
        const raw = localStorage.getItem('safety-guardian-v2');
        const st = raw ? JSON.parse(raw) : {};
        st.storySeen = st.storySeen || {};
        st.storySeen[key] = storyData[key].chapters.length - 1;
        localStorage.setItem('safety-guardian-v2', JSON.stringify(st));
    } catch (_) {}
}

// ═══════════════════════════════════════════════
// 背景音樂：以 Web Audio 即時合成的溫和氛圍音樂（柔和和弦＋輕鈴聲＋水聲）
// 不使用任何音檔，因此沒有版權問題
// ═══════════════════════════════════════════════
const music = (() => {
    // 兩套聲音：river＝時間之河（流水、豎琴琶音、溫暖和弦）／scene＝事故現場（低沉持續音、稀疏鋼琴、微風）
    let ctx, master, rev, buses = {}, timer = null, nextT = 0, step = 0, mode = 'river';
    let on = (() => { try { return localStorage.getItem('sg_music') !== 'off'; } catch (_) { return true; } })();
    const RIVER_CHORDS = [[62, 66, 69, 73], [59, 62, 66, 69], [55, 59, 62, 66], [57, 61, 64, 69]];   // Dmaj7 Bm7 Gmaj7 A
    const SCENE_ROOTS = [45, 41, 43, 40];                                                        // A F G E（低音）
    const SCENE_NOTES = [69, 72, 74, 76, 79, 81];                                               // A 小調五聲音階
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const rnd = a => a[Math.floor(Math.random() * a.length)];

    function noiseBuffer(sec) {
        const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        return b;
    }
    function init() {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0;
        const comp = ctx.createDynamicsCompressor();
        rev = ctx.createConvolver();
        const len = ctx.sampleRate * 4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
        rev.buffer = ir;
        const wet = ctx.createGain(); wet.gain.value = .55; rev.connect(wet); wet.connect(master);
        master.connect(comp); comp.connect(ctx.destination);
        for (const k of ['river', 'scene', 'sfx']) {
            const g = ctx.createGain(); g.gain.value = k === mode || k === 'sfx' ? 1 : 0;
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = k === 'scene' ? 1100 : 2400;
            g.connect(lp); lp.connect(master); lp.connect(rev);
            buses[k] = g;
        }
        // 時間之河：兩層流水聲，音量緩慢起伏
        const nb = noiseBuffer(4);
        const w1 = ctx.createBufferSource(); w1.buffer = nb; w1.loop = true;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = .7;
        const w1g = ctx.createGain(); w1g.gain.value = .028;
        const lfo = ctx.createOscillator(); lfo.frequency.value = .13; const lfoG = ctx.createGain(); lfoG.gain.value = .012;
        lfo.connect(lfoG); lfoG.connect(w1g.gain); lfo.start();
        w1.connect(bp); bp.connect(w1g); w1g.connect(buses.river); w1.start();
        const w2 = ctx.createBufferSource(); w2.buffer = nb; w2.loop = true; w2.playbackRate.value = .7;
        const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 260;
        const w2g = ctx.createGain(); w2g.gain.value = .05;
        w2.connect(lp2); lp2.connect(w2g); w2g.connect(buses.river); w2.start();
        // 事故現場：低處的微風
        const wind = ctx.createBufferSource(); wind.buffer = nb; wind.loop = true; wind.playbackRate.value = .5;
        const wlp = ctx.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 500;
        const wg = ctx.createGain(); wg.gain.value = .02;
        const wlfo = ctx.createOscillator(); wlfo.frequency.value = .07; const wlfoG = ctx.createGain(); wlfoG.gain.value = 250;
        wlfo.connect(wlfoG); wlfoG.connect(wlp.frequency); wlfo.start();
        wind.connect(wlp); wlp.connect(wg); wg.connect(buses.scene); wind.start();
    }
    function tone({ f, type = 'sine', t, a = .02, peak = .03, hold = 0, rel = 2, bus = 'river', detune = 0 }) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = f; o.detune.value = detune;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + a);
        if (hold) g.gain.setValueAtTime(peak, t + a + hold);
        g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + rel);
        o.connect(g); g.connect(buses[bus]); o.start(t); o.stop(t + a + hold + rel + .1);
    }
    // ── 時間之河：溫暖和弦＋豎琴琶音＋偶爾的水滴 ──
    function riverBar(t) {
        const ch = RIVER_CHORDS[step % RIVER_CHORDS.length], dur = 8;
        ch.forEach((n, i) => tone({ f: hz(n - 12), type: 'triangle', t, a: 2.5, peak: .03, hold: dur - 3, rel: 3, detune: (Math.random() - .5) * 8 }));
        tone({ f: hz(ch[0] - 24), t, a: 2, peak: .06, hold: dur - 2.5, rel: 3 });
        const arp = [...ch, ch[1] + 12, ch[2] + 12];
        for (let k = 0; k < 12; k++) {
            if (Math.random() < .25) continue;
            const n = arp[k % arp.length];
            tone({ f: hz(n), t: t + k * (dur / 12) + Math.random() * .05, a: .01, peak: .022, rel: 1.8 });
            tone({ f: hz(n) * 2, t: t + k * (dur / 12), a: .01, peak: .006, rel: .9 });
        }
        for (let k = 0; k < 2; k++) if (Math.random() < .7) {   // 水滴
            const td = t + Math.random() * dur, o = ctx.createOscillator(), g = ctx.createGain();
            o.frequency.setValueAtTime(1400 + Math.random() * 600, td); o.frequency.exponentialRampToValueAtTime(500, td + .12);
            g.gain.setValueAtTime(.018, td); g.gain.exponentialRampToValueAtTime(.0001, td + .15);
            o.connect(g); g.connect(buses.river); o.start(td); o.stop(td + .2);
        }
        return dur;
    }
    // ── 事故現場：低沉持續音＋稀疏的鋼琴音 ──
    function sceneBar(t) {
        const root = SCENE_ROOTS[step % SCENE_ROOTS.length], dur = 10;
        for (const [n, ty, pk] of [[root, 'sawtooth', .018], [root + 7, 'sawtooth', .012], [root + 12, 'sine', .03]]) {
            tone({ f: hz(n), type: ty, t, a: 3.5, peak: pk, hold: dur - 4, rel: 4, bus: 'scene', detune: (Math.random() - .5) * 10 });
        }
        const count = 2 + Math.floor(Math.random() * 2);
        for (let k = 0; k < count; k++) {
            const tn = t + 1 + k * (dur / count) + Math.random(), n = rnd(SCENE_NOTES);
            tone({ f: hz(n), t: tn, a: .01, peak: .03, rel: 4, bus: 'scene' });
            tone({ f: hz(n) * 2, t: tn, a: .01, peak: .008, rel: 2, bus: 'scene' });
            tone({ f: hz(n) * 3, t: tn, a: .01, peak: .004, rel: 1, bus: 'scene' });
        }
        return dur;
    }
    function schedule() {
        while (nextT < ctx.currentTime + 1.5) { nextT += (mode === 'river' ? riverBar : sceneBar)(nextT); step++; }
    }
    function start() {
        if (!on) return;
        try {
            if (!ctx) init();
            ctx.resume();
            if (nextT < ctx.currentTime) nextT = ctx.currentTime + .1;
            clearInterval(timer); timer = setInterval(schedule, 400); schedule();
            master.gain.cancelScheduledValues(ctx.currentTime);
            master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
            master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 3);
        } catch (_) {}
    }
    function stop() {
        if (!ctx) return;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
        clearInterval(timer); timer = null;
    }
    // ── 音效 ──
    function sfx(name) {
        if (!on || !ctx || !timer) return;
        const t = ctx.currentTime + .02;
        if (name === 'tock') {   // 骨牌倒下：木頭敲擊聲
            tone({ f: 190, t, a: .003, peak: .12, rel: .18, bus: 'sfx' });
            tone({ f: 620, type: 'triangle', t, a: .002, peak: .04, rel: .06, bus: 'sfx' });
        } else if (name === 'boom') {   // 事故發生：低沉的悶響（刻意柔和，不驚嚇）
            const s = ctx.createBufferSource(); s.buffer = noiseBuffer(2);
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
            const g = ctx.createGain(); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.8);
            s.connect(lp); lp.connect(g); g.connect(buses.sfx); s.start(t); s.stop(t + 2);
            tone({ f: 55, t, a: .01, peak: .12, rel: 1.6, bus: 'sfx' });
        } else if (name === 'bell') {   // 追思：遠方的鐘聲
            for (const [f, p] of [[440, .05], [880, .025], [1320, .012]]) tone({ f, t, a: .01, peak: p, rel: 6, bus: 'sfx' });
        } else if (name === 'chime') {   // 連鎖中斷：明亮的和弦
            [74, 78, 81, 86].forEach((n, i) => tone({ f: hz(n), t: t + i * .12, a: .01, peak: .03, rel: 2.5, bus: 'sfx' }));
        }
    }
    function label() { $('btn-music').textContent = `♪ 音樂：${on ? '開' : '關'}`; }
    label();
    return {
        start, stop, sfx,
        toggle() { on = !on; try { localStorage.setItem('sg_music', on ? 'on' : 'off'); } catch (_) {} label(); on ? start() : stop(); },
        setMood(m) {   // calm → 時間之河；solemn → 事故現場
            const next = m === 'calm' ? 'river' : 'scene';
            if (next === mode) return;
            mode = next; step = 0;
            if (!ctx) return;
            const t = ctx.currentTime;
            for (const k of ['river', 'scene']) {
                buses[k].gain.cancelScheduledValues(t);
                buses[k].gain.setValueAtTime(buses[k].gain.value, t);
                buses[k].gain.linearRampToValueAtTime(k === mode ? 1 : 0, t + 2.5);
            }
        },
        get on() { return on; },
    };
})();
$('btn-music').onclick = () => music.toggle();
$('btn-river').onclick = () => (active === river ? goStop(stopIndex) : backToRiver());

// 場景一：時間之河

const HAS3D = ['case2', 'case3', 'puyuma', 'taroko', 'mataian'];   // 有 3D 因果骨牌場景的事件

const EVENTS = Object.keys(cases).map(key => ({ key, ...cases[key], has3d: HAS3D.includes(key) }));
const GATE_GAP = 230, FIRST_GATE = -170;
const gateZ = i => FIRST_GATE - i * GATE_GAP;
const END_Z = gateZ(EVENTS.length - 1) - GATE_GAP;   // 終點：重新思考之門
const stops = [0, ...EVENTS.map((_, i) => gateZ(i) + 34), END_Z + 34];
const isEndStop = i => i === stops.length - 1;

function buildRiver() {
    const scene = new THREE.Scene();

    const water = makeWater(scene, 5000, 0x2c8d97);
    const L = Math.abs(gateZ(EVENTS.length - 1)) + 700;

    // 兩側長橋：橋面、欄杆、橋墩

    for (const side of [-1, 1]) {

        rail.position.set(side * 11.3, 4.4, -L / 2 + 60); scene.add(rail);
        const n = Math.floor(L / 9);
        const piers = new THREE.InstancedMesh(new THREE.BoxGeometry(7.6, 3, 1.6), stoneDark, n);
        const m = new THREE.Matrix4();
        for (let i = 0; i < n; i++) { m.makeTranslation(side * 15, 1.4, 60 - i * 9); piers.setMatrixAt(i, m); }
        scene.add(piers);
    }
    // 燈柱（會發光）
    const nL = Math.floor(L / 26);
    const posts = new THREE.InstancedMesh(new THREE.CylinderGeometry(.22, .3, 3.2, 6), stoneDark, nL * 2);
    const lamps = new THREE.InstancedMesh(new THREE.OctahedronGeometry(.55), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff1d0, emissiveIntensity: 6 }), nL * 2);
    const m4 = new THREE.Matrix4();
    for (let i = 0; i < nL; i++) for (const [k, side] of [[0, -1], [1, 1]]) {
        const z = 40 - i * 26;
        m4.makeTranslation(side * 11.3, 6.5, z); posts.setMatrixAt(i * 2 + k, m4);
        m4.makeScale(1, 1.6, 1).setPosition(side * 11.3, 8.6, z); lamps.setMatrixAt(i * 2 + k, m4);
    }
    scene.add(posts, lamps);

    // 遠山
    const mCols = [0x1f3a2c, 0x27442f, 0x1c3326, 0x2e4d38];
    for (let i = 0; i < 26; i++) {
        const side = i % 2 ? 1 : -1;
        const x = side * (160 + Math.random() * 520), z = -250 - Math.random() * (L + 600);
        const mt = mountain(90 + Math.random() * 140, 90 + Math.random() * 170, mCols[i % 4], i + 3);
        mt.position.x = x; mt.position.z = z; scene.add(mt);
    }
    const big = mountain(420, 380, 0x274232, 99); big.position.set(0, 188, -L - 600); scene.add(big);

    // 終點的光（時間的盡頭）
    const star = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    star.scale.set(160, 160, 1); star.position.set(0, 40, -L - 150); scene.add(star);

    const gates = EVENTS.map((ev, i) => {
        const z = gateZ(i), g = new THREE.Group();
        for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(2.4, 18, 2.4), stone); p.position.set(s * 11.3, 12, 0); g.add(p); }
        const beam = new THREE.Mesh(new THREE.BoxGeometry(26, 2, 2.6), gold); beam.position.y = 21.5; g.add(beam);
        const arch = new THREE.Mesh(new THREE.TorusGeometry(11.3, .7, 8, 40, Math.PI), gold); arch.position.y = 9; g.add(arch);
        const tex = textTexture([
            { text: ev.year, font: '500 150px "Cormorant Garamond", serif', y: 170, color: ev.has3d ? '#ffe7a8' : '#ffffff' },
            { text: ev.title, font: '700 76px "Noto Serif TC", serif', y: 330, blur: 12 },
            { text: ev.has3d ? '— 3D 因果動畫 —' : '— 平面版故事 —', font: 'italic 500 44px "Cormorant Garamond", "Noto Serif TC", serif', y: 440, color: '#e5e7eb', blur: 6 },
        ], { bg: 'rgba(8,12,20,.78)' });
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(26, 13), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
        sign.position.y = 27; g.add(sign);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(ev.has3d ? '255,215,140' : '200,220,255'), transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
        halo.scale.set(40, 40, 1); halo.position.y = 30; g.add(halo);
        g.position.z = z;
        scene.add(g);
        return { g, sign, halo };
    });
    // 終點：重新思考之門
    const endGate = new THREE.Group();
    for (const sd of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(2.4, 18, 2.4), stone); p.position.set(sd * 11.3, 12, 0); endGate.add(p); }
    const endArch = new THREE.Mesh(new THREE.TorusGeometry(11.3, .9, 8, 40, Math.PI), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xcfe8ff, emissiveIntensity: 1.2 }));
    endArch.position.y = 9; endGate.add(endArch);
    const endSign = new THREE.Mesh(new THREE.PlaneGeometry(26, 13), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: textTexture([
        { text: 'REFLECT', font: '500 120px "Cormorant Garamond", serif', y: 170, color: '#cfe8ff' },
        { text: '終點・重新思考', font: '700 80px "Noto Serif TC", serif', y: 330, blur: 12 },
        { text: '— 選一起事故，深入分析 —', font: 'italic 500 44px "Cormorant Garamond", "Noto Serif TC", serif', y: 440, color: '#e5e7eb', blur: 6 },
    ], { bg: 'rgba(8,12,20,.78)' }) }));
    endSign.position.y = 27; endGate.add(endSign);
    const endHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('200,230,255'), transparent: true, opacity: .6, depthWrite: false, blending: THREE.AdditiveBlending }));
    endHalo.scale.set(44, 44, 1); endHalo.position.y = 30; endGate.add(endHalo);
    endGate.position.z = END_Z; scene.add(endGate);

    // 小船
    const boat = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), new THREE.MeshStandardMaterial({ color: 0x6b3f22, roughness: .7 }));
    hull.scale.set(1.5, .8, 4); boat.add(hull);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 2.2), new THREE.MeshStandardMaterial({ color: 0x8a5a33 }));
    cabin.position.set(0, .9, .6); boat.add(cabin);
    const lantern = new THREE.Mesh(new THREE.SphereGeometry(.25, 8, 8), new THREE.MeshStandardMaterial({ emissive: 0xffc070, emissiveIntensity: 4 }));
    lantern.position.set(0, 1.8, -1.6); boat.add(lantern);
    scene.add(boat);

    // 水面薄霧
    const mistMat = new THREE.SpriteMaterial({ map: glowTexture('235,242,248'), transparent: true, opacity: .16, depthWrite: false });
    for (let i = 0; i < 40; i++) {
        const s = new THREE.Sprite(mistMat);

    let boatZ = 0, targetZ = 0, time = 0;
    return {
        scene, gates, endGate,
        get boatZ() { return boatZ; },
        setTarget(z) { targetZ = z; },
        jump(z) { boatZ = targetZ = z; },
        update(dt) {
            time += dt;
            water.update(dt);
            boatZ += (targetZ - boatZ) * Math.min(1, dt * 0.9);
            boat.position.set(Math.sin(time * .4) * .4, .35 + Math.sin(time * 1.6) * .12, boatZ);
            boat.rotation.z = Math.sin(time * 1.3) * .03;
            camera.position.set(Math.sin(time * .25) * .6, 9 + Math.sin(time * .5) * .2, boatZ + 26);
            camLook.set(0, 10, boatZ - 80);

// ═══════════════════════════════════════════════
// 共用：事故現場的五張骨牌、追思燈與塵埃
// ═══════════════════════════════════════════════
const DOMINO_NAMES = ['環境因素', '人為疏失', '危險因素', '意外事故', '損失'];
function makeKit(scene, { domX, domZ, y = 0, lanterns: nL, area }) {
    const dominoes = DOMINO_NAMES.map((name, i) => {
        const pivot = new THREE.Group();
        const tex = textTexture([
            { text: String(i + 1), font: '500 170px "Cormorant Garamond", serif', y: 190, color: '#f5d48a' },
            { text: name, font: '700 110px "Noto Serif TC", serif', y: 420, blur: 10 },
        ], { w: 512, h: 1024, bg: '#141a24' });
        const face = new THREE.MeshStandardMaterial({ map: tex, roughness: .5, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .35 });
        const side = new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: .6 });
        const slab = new THREE.Mesh(new THREE.BoxGeometry(3.2, 6.4, 1), [side, side, side, side, face, side]);
        slab.position.set(-1.6, 3.2, 0); // 以右下角為支點
        pivot.add(slab);
        pivot.position.set(domX + i * 5.2 + 1.6, y, domZ);
        pivot.rotation.y = -0.18;
        scene.add(pivot);
        return { pivot, slab, removed: false };
    });
    const base = new THREE.Mesh(new THREE.BoxGeometry(30, .6, 6), new THREE.MeshStandardMaterial({ color: 0x2a303a, roughness: .8 }));
    base.position.set(domX + 11.5, y - .3, domZ + .5); base.rotation.y = -0.18; scene.add(base);
    function fallDomino(i) {
        const d = dominoes[i];
        const target = (i === 4 || dominoes[i + 1]?.removed) ? -Math.PI / 2 : -1.05;
        setTimeout(() => music.sfx('tock'), 820);
        return tween(.9, k => { d.pivot.rotation.z = target * k; }, t => t * t);
    }
    // 追思燈：數量等於罹難人數
    const lanterns = [];
    const lanternMat = new THREE.SpriteMaterial({ map: glowTexture('255,210,140'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    for (let i = 0; i < nL; i++) {
        const s = new THREE.Sprite(lanternMat.clone()); s.scale.set(1.6, 1.6, 1); s.visible = false; scene.add(s);
        lanterns.push({ s, x: area.x + (Math.random() - .5) * area.w, z: area.z + (Math.random() - .5) * area.d, sp: .6 + Math.random() * .8, ph: Math.random() * 6 });
    }
    const y0 = area.y ?? 2;
    const dust = [];
    const dustMats = {};
    function puff(at, n = 14, color = '190,170,140') {
        dustMats[color] = dustMats[color] || new THREE.SpriteMaterial({ map: glowTexture(color), transparent: true, opacity: .5, depthWrite: false });
        for (let i = 0; i < n; i++) {
            const s = new THREE.Sprite(dustMats[color].clone());
            s.position.set(at[0] + (Math.random() - .5) * 4, at[1] + Math.random() * 2, at[2] + (Math.random() - .5) * 4);
            s.scale.setScalar(2); scene.add(s);
            dust.push({ s, life: 0, v: new THREE.Vector3((Math.random() - .5) * 2, 1 + Math.random() * 2, (Math.random() - .5) * 2) });
        }
    }
    let time = 0, lanternOn = false;
    return {
        dominoes, fallDomino, puff,
        dom: [[domX + 12, y + 7.5, domZ + 26], [domX + 12, y + 3.5, domZ - 2]],
        lanternsOn(v) { if (v && !lanternOn) music.sfx('bell'); lanternOn = v; if (!v) lanterns.forEach(l => l.s.visible = false); },
        reset() {
            dominoes.forEach(d => { d.pivot.rotation.z = 0; d.pivot.position.y = y; d.slab.visible = !d.removed; });
            this.lanternsOn(false);
        },
        async lift(i) { const d = dominoes[i]; d.removed = true; await tween(1, t => { d.pivot.position.y = y + t * 9; }); d.slab.visible = false; },
        update(dt) {
            time += dt;
            if (lanternOn) lanterns.forEach(l => {
                l.s.visible = true;
                l.s.position.set(l.x + Math.sin(time * .5 + l.ph) * .8, y0 + ((time * l.sp + l.ph * 5) % 60), l.z);
                l.s.material.opacity = Math.min(1, (y0 + 60 - l.s.position.y) / 20);
            });
            for (let i = dust.length - 1; i >= 0; i--) {
                const d = dust[i]; d.life += dt;
                d.s.position.addScaledVector(d.v, dt); d.s.scale.setScalar(2 + d.life * 3);
                d.s.material.opacity = Math.max(0, .5 - d.life * .25);
                if (d.life > 2) { scene.remove(d.s); dust.splice(i, 1); }
            }
        },
    };
}
// 追思時：場景轉暗
function makeDimmer(scene, lights) {
    const fog0 = scene.fog.color.clone(), i0 = lights.map(l => l.intensity);
    return {
        async dim(to = 0x2a2f3a) {
            const f0 = scene.fog.color.clone(), f1 = new THREE.Color(to);
            await tween(2.5, k => { scene.fog.color.lerpColors(f0, f1, k); lights.forEach((l, j) => l.intensity = i0[j] * (1 - .7 * k)); });
        },
        restore() { scene.fog.color.copy(fog0); lights.forEach((l, j) => l.intensity = i0[j]); },
    };
}
function flash() { $('flash').style.opacity = .85; setTimeout(() => $('flash').style.opacity = 0, 180); music.sfx('boom'); }

function buildTaroko() {

    const nS = 560, sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(2.6, .2, .45), new THREE.MeshStandardMaterial({ color: 0x5b4a3a }), nS);
    const mm = new THREE.Matrix4();

    const hillGeo = new THREE.ExtrudeGeometry(hillShape, { depth: 52, bevelEnabled: false });
    const hill = new THREE.Mesh(hillGeo, new THREE.MeshStandardMaterial({ color: 0x6f7a5a, flatShading: true, roughness: 1 }));
    hill.position.z = -6; scene.add(hill);
    // 邊坡表面（事故時會發出警示紅光）

    const slope = new THREE.Mesh(new THREE.BoxGeometry(20.12, .2, 50), slopeMat);
    slope.rotation.z = SLOPE; slope.position.set(11, 4.6, 20); scene.add(slope);
    // 施工便道：沿著邊坡斜斜往下
    const ramp = new THREE.Mesh(new THREE.BoxGeometry(12, .3, 5), new THREE.MeshStandardMaterial({ color: 0xa89a7a, roughness: 1 }));
    ramp.rotation.z = SLOPE; ramp.position.set(14.5, 6.45, 27); scene.add(ramp);
    // 邊坡防護（抽掉骨牌後才出現）

    // 挖掘機（在工地平台上，手臂朝向邊坡）

    const excavator = new THREE.Group();
    const exBody = new THREE.Mesh(new THREE.BoxGeometry(4, 2.2, 4.5), yellow); exBody.position.y = 2.4; excavator.add(exBody);
    const exTrack = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.2, 5.5), new THREE.MeshStandardMaterial({ color: 0x2b2b2b })); exTrack.position.y = .7; excavator.add(exTrack);
    const armPivot = new THREE.Group(); armPivot.position.set(0, 3.2, -2); excavator.add(armPivot);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(.7, .7, 6), yellow); arm.position.z = -3; armPivot.add(arm);
    armPivot.rotation.x = .35;
    excavator.position.set(28, 9, 29); excavator.rotation.y = Math.PI / 2; scene.add(excavator);

    // 大貨車
    const truck = new THREE.Group();
    truck.rotation.order = 'YXZ';
    const cab = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.4, 2.2), new THREE.MeshStandardMaterial({ color: 0x2f6fb0, roughness: .5 })); cab.position.set(0, 1.9, -2.4); truck.add(cab);
    const bed = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 5), new THREE.MeshStandardMaterial({ color: 0x9aa0a6 })); bed.position.set(0, 1.5, 1.3); truck.add(bed);
    const wheelG = new THREE.CylinderGeometry(.55, .55, .4, 14); wheelG.rotateZ(Math.PI / 2);
    for (const [x, z] of [[-1.3, -2.4], [1.3, -2.4], [-1.3, 2.4], [1.3, 2.4]]) {
        const w = new THREE.Mesh(wheelG, new THREE.MeshStandardMaterial({ color: 0x111111 })); w.position.set(x, .55, z); truck.add(w);
    }
    scene.add(truck);
    const onSlope = x => (x - 2) * Math.tan(SLOPE) + .12;
    const TRUCK_PARK = { p: [31, 9, 22], r: [0, Math.PI / 2, 0] };
    const TRUCK_EDGE = { p: [21, 9, 26], r: [0, Math.PI / 2, 0] };
    const TRUCK_RAMP = { p: [15, onSlope(15), 27], r: [-SLOPE, Math.PI / 2, 0] };
    const TRUCK_TRACK = { p: [1.2, .3, 21], r: [0, 1.9, .5] };
    const TRUCK_FENCE = { p: [6.2, onSlope(6.2), 24], r: [-SLOPE, Math.PI / 2, 0] };
    // 吊帶
    const strap = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, 1, 6), new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0xff5a00, emissiveIntensity: .6 }));
    strap.visible = false; scene.add(strap);
    function setStrap() {
        const a = new THREE.Vector3(), b = new THREE.Vector3();
        arm.getWorldPosition(a); a.add(new THREE.Vector3(0, 0, -3).applyQuaternion(arm.getWorldQuaternion(new THREE.Quaternion())));
        cab.getWorldPosition(b);
        strap.position.copy(a).add(b).multiplyScalar(.5);
        strap.scale.y = a.distanceTo(b);
        strap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    }
    const lerpState = (a, b, k) => { truck.position.set(...a.p.map((v, i) => v + (b.p[i] - v) * k)); truck.rotation.set(...a.r.map((v, i) => v + (b.r[i] - v) * k)); };

    // 列車：8 節車廂，白色車身＋紅色腰帶
    const white = new THREE.MeshStandardMaterial({ color: 0xf1f2f4, roughness: .35, metalness: .2 });
    const red = new THREE.MeshStandardMaterial({ color: 0xc8322c, roughness: .4 });
    const glass = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: .1, metalness: .6 });
    const CAR = 20.5, cars = [];
    for (let i = 0; i < 8; i++) {
        const c = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.4, 20), white); body.position.y = 2.3; c.add(body);
        const band = new THREE.Mesh(new THREE.BoxGeometry(3.26, .45, 20.02), red); band.position.y = 1.4; c.add(band);
        const win = new THREE.Mesh(new THREE.BoxGeometry(3.24, .9, 18), glass); win.position.y = 2.8; c.add(win);
        if (i === 0) {
            const nose = new THREE.Mesh(new THREE.CylinderGeometry(0, 2.2, 4, 4, 1), white);
            nose.rotation.set(-Math.PI / 2, Math.PI / 4, 0); nose.scale.set(1, 1, .75); nose.position.set(0, 2.1, -11.5); c.add(nose);
            const lamp = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 8), new THREE.MeshStandardMaterial({ emissive: 0xffffff, emissiveIntensity: 4 }));
            lamp.position.set(0, 2.2, -13.3); c.add(lamp);
        }
        scene.add(c); cars.push(c);
    }
    let trainHead = 480, derail = 0;
    function placeTrain() {
        cars.forEach((c, i) => {
            const z = trainHead + i * CAR;
            const k = Math.max(0, Math.min(1, derail * 1.4 - i * .06));
            const zig = (i % 2 ? 1 : -1) * k;
            c.position.set(zig * (1.2 + i * .15), k * .6, z);
            c.rotation.set(0, zig * .18, zig * .12);
        });
    }

    const kit = makeKit(scene, { domX: -46, domZ: 58, lanterns: 49, area: { x: 0, z: 30, w: 30, d: 40 } });
    const dimmer = makeDimmer(scene, [hemi, dl]);
    const puff = kit.puff;

    function reset() {
        kit.reset();
        lerpState(TRUCK_PARK, TRUCK_PARK, 0); strap.visible = false; fence.visible = false;
        armPivot.rotation.x = .35;
        trainHead = 480; derail = 0; placeTrain();
        slopeMat.emissive.setHex(0x000000);
        dimmer.restore();
    }
    reset();

    const S = {
        wide:   [[-40, 36, 125], [2, 4, 14]],
        slope:  [[-14, 20, 62], [14, 5, 24]],
        slide:  [[-16, 10, 48], [6, 3, 22]],
        track:  [[-10, 4.5, 80], [0, 3, 10]],
        impact: [[-22, 12, 55], [0, 3, 12]],
        sky:    [[40, 18, 95], [0, 22, 20]],
    };
    async function slopeWarn() { await tween(1.2, k => slopeMat.emissive.setRGB(.5 * Math.sin(k * Math.PI * 3) ** 2, .05, 0)); slopeMat.emissive.setRGB(.25, .02, 0); }
    async function truckStall() {
        await tween(1.4, k => lerpState(TRUCK_PARK, TRUCK_EDGE, k));
        await tween(1.4, k => lerpState(TRUCK_EDGE, TRUCK_RAMP, k));
        puff([15, 8, 27], 8);
        await wait(.6);
        strap.visible = true;
        await tween(1, k => { armPivot.rotation.x = .35 - .3 * k; });
    }
    async function truckSlide(stopAtFence = false) {
        const b = stopAtFence ? TRUCK_FENCE : TRUCK_TRACK;
        strap.visible = false;
        puff([13, 6, 27]);
        await tween(1.6, k => lerpState(TRUCK_RAMP, b, k), t => t * t);
        puff(b.p, 18);
    }
    async function trainCome(crash) {
        const stopAt = crash ? 18.5 : -250, start = trainHead;
        await tween(crash ? 3.2 : 6, k => { trainHead = start + (stopAt - start) * k; }, t => t);
        if (!crash) return;
        flash(); camShake = 1.2;
        puff([0, 2, 18], 30);
        truck.position.set(-4, .6, 6); truck.rotation.set(.4, 1.6, 1.2);
        await tween(1.8, k => { trainHead = 18.5 - 40 * k; derail = k; }, t => 1 - (1 - t) * (1 - t));
    }
    function showFence() { fence.visible = true; return tween(.8, k => { fence.scale.y = k; }); }

    return {
        scene, kit, reset,
        intro: '2021・04・02 ・ 花蓮 清水隧道北口',
        prefix: { 3: '約 09:28，' },
        shots: { wide: S.wide, beats: [S.slope, S.slope, S.slide, S.track, S.sky] },
        beats: [
            slopeWarn,
            truckStall,
            async () => { await wait(1); await truckSlide(); },
            async () => { moveCamera(...S.impact, 3.4); await trainCome(true); },
            async () => { await dimmer.dim(); kit.lanternsOn(true); },
        ],
        memorial: '升起的 49 盞燈，代表 49 條再也回不了家的生命。',
        told: {
            1: '若邊坡有防護設施、便道依設計鋪設，大貨車就算熄火，也不會一路滑落到軌道上。',
            2: '若沒有在停工期間違規進入工地，或車輛故障時交給專業業者處理並通報台鐵，大貨車就不會被硬拖而滑落。',
            3: '若軌道旁有防護設施，或及時通報攔停列車，軌道上的危險就能在列車抵達前被排除。',
        },
        async safe(k) {
            if (k === 0) { moveCamera(...S.slope, 2); await showFence(); }
            if (k === 2) { await showFence(); await truckSlide(true); }
            await wait(.8);
            await moveCamera(...S.track, 2);
            return {
                title: '列車平安駛入隧道', text: '軌道淨空，408次列車和車上的每一個人，都能準時抵達目的地。',
                after: async () => { moveCamera(...S.wide, 5); await trainCome(false); },
            };
        },
        update(dt) {
            sea.update(dt);
            kit.update(dt);
            if (strap.visible) setStrap();
            placeTrain();
        },
    };
}

function mataianHeight(x, z) {
    const ax = Math.abs(x);

    const mountainZone = THREE.MathUtils.clamp((-20 - z) / 60, 0, 1);          // 越上游，兩側山壁越高
    const w = 20 + (1 - mountainZone) * 8;
    if (ax > w) h += Math.pow(ax - w, 1.2) * 0.42 * mountainZone;
    if (ax > 210) h += (ax - 210) * .5 * (1 - mountainZone);                     // 平原遠處的丘陵
    const rough = THREE.MathUtils.clamp((ax - 12) / 20, 0, 1);                   // 溪床保持平順，山壁才有起伏
    h += (Math.sin(x * .07 + z * .05) + Math.sin(x * .13 - z * .09)) * 2.2 * mountainZone * rough;
    const hx = x - 150, hz = z - 130;                                            // 避難處所所在的小山丘
    h += 26 * Math.exp(-(hx * hx + hz * hz) / 900);
    return h;
}
