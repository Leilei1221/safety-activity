    const lakeLabel = new THREE.Mesh(new THREE.PlaneGeometry(26, 4), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
        map: textTexture([{ text: '堰塞湖', font: '700 120px "Noto Serif TC", serif', y: 90, color: '#dff4ff', blur: 8 }], { w: 1024, h: 180 }) }));
    lakeLabel.position.set(0, DAM_TOP + 22, DAM_Z - 90); scene.add(lakeLabel);
    // 疏洪道（抽掉骨牌後才出現）
    const spill = new THREE.Mesh(new THREE.BoxGeometry(8, 1.5, 44), new THREE.MeshStandardMaterial({ color: 0x3ddc84, emissive: 0x22aa55, emissiveIntensity: .8 }));
    spill.position.set(26, DAM_TOP - 8, DAM_Z); spill.visible = false; scene.add(spill);

    // 泥流：沿著河谷往下游一段段延伸，表面紋理持續往下游流動
    const ftex = flowTexture();
    const N = 150, fpos = [], fuv = [], fidx = [];
    const Z0 = DAM_Z + 18, Z1 = 300;
    for (let i = 0; i <= N; i++) {
        const z = Z0 + (Z1 - Z0) * i / N;
        const y = (i === 0 ? DAM_TOP : mataianFloor(z)) + 1.6;
        const w = z < -40 ? 18 : 30;
        fpos.push(-w / 2, y, z, w / 2, y, z);
        const v = (z - Z0) / 22;
        fuv.push(0, v, 1, v);
        if (i < N) { const a = i * 2; fidx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.Float32BufferAttribute(fpos, 3));
    fg.setAttribute('uv', new THREE.Float32BufferAttribute(fuv, 2));
    fg.setIndex(fidx); fg.computeVertexNormals();
    const flow = new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ map: ftex, roughness: .55, color: 0xffffff }));
    scene.add(flow);
    function setFlow(front) {   // front：泥流前緣的 z 座標
        const n = THREE.MathUtils.clamp(Math.round((front - Z0) / (Z1 - Z0) * N), 0, N);
        fg.setDrawRange(0, n * 6); flow.visible = n > 0;
    }
    const FLOW_SPEED = 1.6;
    // 溢流：壩頂的水花與浪頭的飛沫
    const sprayTex = glowTexture('225,210,185');
    const spray = [];
    for (let i = 0; i < 60; i++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sprayTex, transparent: true, opacity: 0, depthWrite: false }));
        s.scale.set(7, 7, 1); scene.add(s); spray.push({ s, t: Math.random(), x: (Math.random() - .5) * 60, head: i >= 36 });
    }
    let overflowOn = false, frontZ = null;

    // 光復市區：房屋、堤防、台9線馬太鞍溪橋
    const houses = [];
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x8a4b3a, roughness: .8 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: .9 });
    for (let i = 0; i < 40; i++) {
        const x = 30 + (i % 8) * 11 + (Math.random() - .5) * 3, z = 70 + Math.floor(i / 8) * 20 + (Math.random() - .5) * 4;
        const hh = 4 + (i % 3) * 2;
        const h = new THREE.Mesh(new THREE.BoxGeometry(6, hh, 6), wallMat); h.position.set(x, hh / 2, z); scene.add(h);
        const r = new THREE.Mesh(new THREE.ConeGeometry(4.6, 2.4, 4), roofMat); r.rotation.y = Math.PI / 4; r.position.set(x, hh + 1.2, z); scene.add(r);
        houses.push({ x, z });
    }
    const leveeMat = new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: .9 });
    const levee = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 150), leveeMat); levee.position.set(19, 2, 135); scene.add(levee);
    const breach = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 50), leveeMat.clone()); breach.position.set(19, 2, 35); scene.add(breach);
    const deck = new THREE.Mesh(new THREE.BoxGeometry(46, 1.2, 7), new THREE.MeshStandardMaterial({ color: 0xb5b0a6, roughness: .8 }));
    scene.add(deck);
    const piers = [];
    for (const x of [-12, 0, 12]) { const p = new THREE.Mesh(new THREE.BoxGeometry(1.6, 5, 4), leveeMat); p.position.set(x, 2.5, 20); scene.add(p); piers.push(p); }
    const mkLabel = (text, color, w, pos) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * .14), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
            map: textTexture([{ text, font: '700 100px "Noto Serif TC", serif', y: 70, color, blur: 8 }], { w: 1024, h: 140 }) }));
        m.position.set(...pos); scene.add(m); return m;
    };
    mkLabel('台9線 馬太鞍溪橋', '#ffffff', 22, [0, 12, 20]);
    mkLabel('光復鄉市區', '#ffffff', 26, [68, 22, 110]);
    const shelterY = mataianHeight(150, 130);
    const shelter = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 10), new THREE.MeshStandardMaterial({ color: 0xf2efe6 })); shelter.position.set(150, shelterY + 2.5, 130); scene.add(shelter);
    mkLabel('避難處所', '#bff5d0', 18, [150, shelterY + 11, 130]);
    // 淹進市區的泥水（同樣有流動紋理）
    const ftex2 = ftex.clone(); ftex2.repeat.set(4, 4); ftex2.needsUpdate = true;
    const flood = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 130), new THREE.MeshStandardMaterial({ map: ftex2, roughness: .6 }));
    flood.position.set(72, 0, 120); flood.visible = false; scene.add(flood);
    // 居民：以光點表示（約七成撤離、三成留在家中）
    const dotGeo = new THREE.SphereGeometry(.9, 8, 8);
    const dots = [];
    for (let i = 0; i < 60; i++) {
        const h = houses[i % houses.length];
        const m = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0xfff1c0 }));
        const home = new THREE.Vector3(h.x + (Math.random() - .5) * 4, 1.5, h.z + 4.5);
        const safe = new THREE.Vector3(150 + (Math.random() - .5) * 18, shelterY + 1.5, 138 + Math.random() * 8);
        m.position.copy(home); scene.add(m);
        dots.push({ m, home, safe, stays: i % 10 >= 7 });
    }
    // 雨
    const rainN = 1800, rp = new Float32Array(rainN * 3);
    for (let i = 0; i < rainN; i++) { rp[i * 3] = (Math.random() - .5) * 420; rp[i * 3 + 1] = Math.random() * 160; rp[i * 3 + 2] = -380 + Math.random() * 640; }
    const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
    const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xd8e2ec, size: .45, transparent: true, opacity: .4 }));
    scene.add(rain);

    const kit = makeKit(scene, { domX: -130, domZ: 150, lanterns: 19, area: { x: 70, z: 110, w: 70, d: 90, y: 4 } });
    const dimmer = makeDimmer(scene, [hemi, dl]);
    let lakeLevel = 0, time = 0, blink = false;

    function reset() {
        kit.reset(); dimmer.restore();
        scar.material.opacity = 0; dam.scale.y = .01; dam.position.y = damBase + .2; lakeLevel = damBase; setLake(lakeLevel);
        spill.visible = false; overflowOn = false; frontZ = null; spray.forEach(o => o.s.material.opacity = 0);
        setFlow(Z0); flood.visible = false; flood.scale.y = .01;
        deck.rotation.set(0, 0, 0); deck.position.set(0, 5.5, 20); piers.forEach(p => p.rotation.set(0, 0, 0));
        breach.visible = true; breach.scale.y = 1; breach.position.y = 2; breach.material.emissive.setHex(0);
        levee.scale.y = 1; levee.position.y = 2; levee.material.emissive.setHex(0);
        dots.forEach(d => { d.m.position.copy(d.home); d.m.visible = true; d.m.material.color.setHex(0xfff1c0); });
        blink = false;
    }
    reset();

    const S = {
        wide:  [[120, 130, 260], [0, 25, -110]],
        dam:   [[0, DAM_TOP + 45, DAM_Z + 120], [0, damBase + 8, DAM_Z - 60]],
        town:  [[130, 60, 240], [70, 5, 110]],
        slope: [[70, 80, -30], [0, 30, -150]],
        flood: [[85, 55, 115], [10, 0, 10]],
        sky:   [[120, 40, 250], [70, 30, 110]],
    };
    async function landslide() {
        await tween(1.2, k => { scar.material.opacity = k; });
        kit.puff([28, damBase + 20, DAM_Z], 30, '160,130,100');
        await tween(1.6, k => { dam.scale.y = Math.max(.01, k); dam.position.y = damBase + 13 * k; }, t => t * t);
        await tween(2.5, k => { lakeLevel = damBase + 14 * k; setLake(lakeLevel); });
    }
    async function evacuate(all) {
        await tween(3.5, k => dots.forEach(d => {
            if (d.stays && !all) return;
            d.m.position.lerpVectors(d.home, d.safe, k); d.m.position.y += Math.sin(k * Math.PI) * 12;
        }));
        if (!all) { blink = true; dots.forEach(d => { if (d.stays) d.m.material.color.setHex(0xffa060); }); }
    }
    async function rise(to) { const from = lakeLevel; await tween(2.5, k => { lakeLevel = from + (to - from) * k; setLake(lakeLevel); }); }
    // 溢流 → 泥流沿河谷沖刷而下 → （沖斷橋梁、衝破堤防、淹進市區）
    async function surge({ breakBridge = true, intoTown = true } = {}) {
        overflowOn = true;
        moveCamera(...S.slope, 2.5);
        await tween(4.2, k => { frontZ = Z0 + (-20 - Z0) * k; setFlow(frontZ); }, t => t * t * .5 + t * .5);   // 沿陡坡往下沖
        flash(); camShake = .7;
        moveCamera(...S.flood, 2.5);
        await tween(2.4, k => { frontZ = -20 + (Z1 - -20) * k; setFlow(frontZ); }, t => t);                   // 衝到平原
        frontZ = null;
        if (breakBridge) { kit.puff([0, 6, 20], 25, '140,110,80'); await tween(1, k => { deck.rotation.z = .5 * k; deck.position.y = 5.5 - 4 * k; piers[1].rotation.z = .7 * k; }); }
        if (intoTown) {
            breach.visible = false; kit.puff([19, 3, 35], 25, '140,110,80');
            flood.visible = true;
            await tween(2.5, k => { flood.scale.y = Math.max(.01, 3.2 * k); flood.position.y = 1.6 * k; });
            blink = false;
            dots.forEach(d => { if (d.stays) d.m.visible = false; });
        }
    }
    return {
        scene, kit, reset,
        intro: '2025・09 ・ 花蓮 馬太鞍溪上游',
        prefix: {},
        shots: { wide: S.wide, beats: [S.dam, S.town, S.dam, S.slope, S.sky] },
        beats: [
            landslide,
            () => evacuate(false),
            async () => { await rise(DAM_TOP + .8); overflowOn = true; await wait(1.5); },
            () => surge(),
            async () => { overflowOn = false; await dimmer.dim(0x2a3038); kit.lanternsOn(true); },
        ],
        memorial: '升起的 19 盞燈，代表 19 位罹難者；另有 5 人至今下落不明。',
        told: {
            1: '若能及早處置堰塞湖、降低湖水位，並持續監測預警，湖水就不會在颱風來時漫過壩頂。',
            2: '若預警訊息清楚傳達、下游居民都及時撤離到安全的地方，即使洪水來襲，也能避免人命傷亡。',
            3: '若河道與堤防足以承受溢流的泥流，洪水就不會衝進光復市區。',
        },
        async safe(k) {
            if (k === 0) {
                moveCamera(...S.dam, 2);
                await landslide();
                spill.visible = true; await rise(damBase + 6);
                return { title: '湖水被安全引走', text: '颱風的雨一樣大，但湖水位已經降低，沒有漫過壩頂。下游的光復鄉平安度過。' };
            }
            if (k === 1) {
                moveCamera(...S.town, 2);
                await evacuate(true);
                moveCamera(...S.dam, 2);
                await rise(DAM_TOP + .8);
                await surge();
                return { title: '洪水來了，但人都平安', text: '洪水仍然淹進市區，但所有居民都已撤離到避難處所。連鎖反應在奪走人命之前中斷。' };
            }
            moveCamera(...S.town, 2);
            await tween(1.2, t => { levee.scale.y = 1 + t; levee.position.y = 2 + 2 * t; breach.scale.y = 1 + t; breach.position.y = 2 + 2 * t; });
            levee.material.emissive.setHex(0x1f8a4c); breach.material.emissive.setHex(0x1f8a4c);
            moveCamera(...S.dam, 2);
            await rise(DAM_TOP + .8);
            await surge({ breakBridge: false, intoTown: false });
            return { title: '洪水留在河道裡', text: '泥流沿著河道流過，被加高加固的堤防擋在市區之外。' };
        },
        update(dt) {
            time += dt;
            kit.update(dt);
            ftex.offset.y -= dt * FLOW_SPEED;         // 泥流表面往下游流動
            ftex2.offset.y -= dt * .25; ftex2.offset.x += dt * .12;
            spray.forEach(o => {
                if (o.head) {   // 浪頭的飛沫
                    if (frontZ === null) { o.s.material.opacity = Math.max(0, o.s.material.opacity - dt * 2); return; }
                    const z = frontZ - Math.random() * 6;
                    o.s.position.set(o.x * .3, mataianFloor(z) + 3 + Math.random() * 5, z);
                    o.s.material.opacity = .8; o.s.scale.setScalar(6 + Math.random() * 6);
                    return;
                }
                if (!overflowOn) { o.s.material.opacity = Math.max(0, o.s.material.opacity - dt); return; }
                o.t = (o.t + dt * .6) % 1;   // 越過壩頂往下落的水花
                o.s.position.set(o.x * .5, DAM_TOP + 2 - o.t * 22, DAM_Z + 14 + o.t * 26);
                o.s.material.opacity = .75 * (1 - o.t);
            });
            if (blink) dots.forEach(d => { if (d.stays) d.m.visible = Math.sin(time * 6) > -.3; });
            const pos = rain.geometry.attributes.position;
            for (let i = 0; i < rainN; i++) { let y = pos.getY(i) - dt * 60; if (y < 0) y += 160; pos.setY(i, y); }
            pos.needsUpdate = true;
        },
    };
}

// ═══════════════════════════════════════════════
// 場景：普悠瑪列車・新馬站彎道（象徵手法，不呈現人物傷亡）
// 軌道：先直線往 -z，再向右轉進新馬站彎道（依調查：第1節車廂右側車輪浮起，向左傾覆）
// ═══════════════════════════════════════════════
function buildPuyuma() {
    const scene = new THREE.Scene();
    const sun = makeSky(scene, 14, 245, { turbidity: 6, rayleigh: 1.6 });
    scene.fog = new THREE.FogExp2(0xbfc8cf, 0.0022);
    scene.environmentIntensity = .5;
    const hemi = new THREE.HemisphereLight(0xe6eeff, 0x3a4a2e, .9);
    const dl = new THREE.DirectionalLight(0xffe6c4, 2.3); dl.position.copy(sun).multiplyScalar(300);
    scene.add(hemi, dl);
    // 稻田
    const fcv = document.createElement('canvas'); fcv.width = fcv.height = 64;
    const fgc = fcv.getContext('2d'); fgc.fillStyle = '#5f8a3e'; fgc.fillRect(0, 0, 64, 64);
    fgc.strokeStyle = '#4c7331'; fgc.lineWidth = 2; for (let i = 0; i < 64; i += 8) { fgc.beginPath(); fgc.moveTo(0, i); fgc.lineTo(64, i); fgc.stroke(); }
    fgc.strokeStyle = '#7a8a5a'; fgc.lineWidth = 3; fgc.strokeRect(0, 0, 64, 64);
    const ftx = new THREE.CanvasTexture(fcv); ftx.wrapS = ftx.wrapT = THREE.RepeatWrapping; ftx.repeat.set(40, 40); ftx.colorSpace = THREE.SRGBColorSpace;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshStandardMaterial({ map: ftx, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);
    for (let i = 0; i < 12; i++) { const m = mountain(70 + Math.random() * 60, 90 + Math.random() * 90, 0x3a5a3c, i + 50); m.position.set(-260 - Math.random() * 200, m.position.y, -300 + i * 70); scene.add(m); }

    // 軌道路徑
    const L1 = 420, R = 110, ARC = THREE.MathUtils.degToRad(85), CX = R;
    function pathAt(s) {
        if (s <= L1) return { p: new THREE.Vector3(0, 0, L1 - s), h: new THREE.Vector3(0, 0, -1) };
        const th = Math.min((s - L1) / R, ARC);
        const p = new THREE.Vector3(CX - R * Math.cos(th), 0, -R * Math.sin(th));
        const h = new THREE.Vector3(Math.sin(th), 0, -Math.cos(th));
        if (s - L1 > R * ARC) p.addScaledVector(h, s - L1 - R * ARC);
        return { p, h };
    }
    const TOTAL = L1 + R * ARC + 300;
    // 鐵軌與枕木
    const railMat = new THREE.MeshStandardMaterial({ color: 0x8d8f93, metalness: .8, roughness: .35 });
    for (const off of [-.75, .75]) {
        const pts = [];
        for (let s = -60; s <= TOTAL; s += 6) { const { p, h } = pathAt(Math.max(0, s)); if (s < 0) p.z += -s; pts.push(p.clone().add(new THREE.Vector3(-h.z, 0, h.x).multiplyScalar(off)).setY(.35)); }
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 300, .12, 5), railMat));
    }
    const nS = Math.floor(TOTAL / 1.3), sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(2.6, .2, .45), new THREE.MeshStandardMaterial({ color: 0x5b4a3a }), nS);
    const d3 = new THREE.Object3D();
    for (let i = 0; i < nS; i++) { const { p, h } = pathAt(i * 1.3); d3.position.copy(p).setY(.15); d3.rotation.set(0, Math.atan2(-h.x, -h.z), 0); d3.updateMatrix(); sleepers.setMatrixAt(i, d3.matrix); }
    scene.add(sleepers);
    // 新馬站月台與站名
    const stationS = L1 + 35;
    const platform = new THREE.Group(); scene.add(platform);
    for (let i = 0; i < 14; i++) {
        const { p, h } = pathAt(stationS + i * 5); const left = new THREE.Vector3(h.z, 0, -h.x);
        const seg = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 5.4), new THREE.MeshStandardMaterial({ color: 0xb9b3a6, roughness: .9 }));
        seg.position.copy(p).addScaledVector(left, -5.5).setY(.6); seg.rotation.y = Math.atan2(-h.x, -h.z); platform.add(seg);
    }
    const signAt = pathAt(stationS + 30), sLeft = new THREE.Vector3(signAt.h.z, 0, -signAt.h.x);
    const stSign = new THREE.Mesh(new THREE.PlaneGeometry(12, 3), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide,
        map: textTexture([{ text: '新馬站', font: '700 150px "Noto Serif TC", serif', y: 128, color: '#ffffff', blur: 8 }], { w: 1024, h: 256, bg: 'rgba(20,60,120,.9)' }) }));
    stSign.position.copy(signAt.p).addScaledVector(sLeft, -9).setY(6); stSign.rotation.y = Math.atan2(-signAt.h.x, -signAt.h.z) + Math.PI / 2; scene.add(stSign);
    // 限速 75 標誌（彎道入口前）
    const lim = new THREE.Mesh(new THREE.CircleGeometry(2.4, 32), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide,
        map: textTexture([{ text: '75', font: '900 300px "Cormorant Garamond", serif', y: 270, color: '#111111', glow: false, blur: 0 }], { w: 512, h: 512, bg: '#ffffff' }) }));
    const ring = new THREE.Mesh(new THREE.RingGeometry(2.4, 2.9, 32), new THREE.MeshBasicMaterial({ color: 0xd62828, side: THREE.DoubleSide }));
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 7, 6), new THREE.MeshStandardMaterial({ color: 0x777777 }));
    pole.position.set(4.5, 3.5, 60); lim.position.set(4.5, 7.5, 60.05); ring.position.copy(lim.position);
    scene.add(pole, lim, ring);

    // 列車：8 節，白色車身、紅色車頭與腰帶
    const white = new THREE.MeshStandardMaterial({ color: 0xf3f3f1, roughness: .35, metalness: .2 });
    const red = new THREE.MeshStandardMaterial({ color: 0xc1272d, roughness: .4 });
    const glass = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: .1, metalness: .6 });
    const CAR = 20.5, cars = [];
    const warnMat = new THREE.MeshStandardMaterial({ color: 0x331111, emissive: 0xff2a2a, emissiveIntensity: 0 });
    for (let i = 0; i < 8; i++) {
        const c = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.4, 20), white); body.position.y = 2.3; c.add(body);
        const band = new THREE.Mesh(new THREE.BoxGeometry(3.26, .5, 20.02), red); band.position.y = 1.5; c.add(band);
        const win = new THREE.Mesh(new THREE.BoxGeometry(3.24, .9, 18), glass); win.position.y = 2.9; c.add(win);
        if (i === 0) {
            const nose = new THREE.Mesh(new THREE.CylinderGeometry(0, 2.2, 4.4, 4, 1), red);
            nose.rotation.set(-Math.PI / 2, Math.PI / 4, 0); nose.scale.set(1, 1, .75); nose.position.set(0, 2.1, -12); c.add(nose);
        }
        if (i === 0 || i === 7) {   // 主風泵（第1、8節）
            const pump = new THREE.Mesh(new THREE.BoxGeometry(2, .6, 3), warnMat); pump.position.set(0, 4.3, 3); c.add(pump);
        }
        scene.add(c); cars.push(c);
    }
    const pumpLabel = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false,
        map: textTexture([{ text: '主風泵故障', font: '700 110px "Noto Serif TC", serif', y: 90, color: '#ffb4a8', blur: 10 }], { w: 1024, h: 180 }) }));
    pumpLabel.scale.set(14, 2.5, 1); scene.add(pumpLabel);
    // ATP 自動防護（藍色防護罩）
    const shieldMat = new THREE.MeshBasicMaterial({ color: 0x5ab8ff, transparent: true, opacity: .16, depthWrite: false, blending: THREE.AdditiveBlending });
    const shield = new THREE.Mesh(new THREE.BoxGeometry(5.5, 6, 8 * CAR + 4), shieldMat); scene.add(shield);
    const atpTexOn = textTexture([{ text: 'ATP 自動防護：開啟', font: '700 90px "Noto Serif TC", serif', y: 90, color: '#bfe6ff', blur: 10 }], { w: 1024, h: 180 });
    const atpTexOff = textTexture([{ text: 'ATP：已被隔離', font: '700 90px "Noto Serif TC", serif', y: 90, color: '#ff9f9f', blur: 10 }], { w: 1024, h: 180 });
    const atpLabel = new THREE.Sprite(new THREE.SpriteMaterial({ map: atpTexOn, transparent: true, depthWrite: false })); atpLabel.scale.set(16, 2.8, 1); scene.add(atpLabel);

    let head = 120, derail = 0, speed = 0, atpOn = true, follow = null;
    const S0 = 120;
    function placeTrain() {
        cars.forEach((c, i) => {
            const { p, h } = pathAt(head - i * CAR - CAR / 2);
            const yaw = Math.atan2(-h.x, -h.z);
            const k = THREE.MathUtils.clamp(derail * 1.3 - i * .05, 0, 1);
            const left = new THREE.Vector3(h.z, 0, -h.x);
            c.position.copy(p).addScaledVector(left, k * (3 + i * .6)).setY(k * .8);
            c.rotation.set(0, yaw + (i % 2 ? 1 : -1) * .22 * k, k * (1.35 - i * .06));
        });
        const mid = pathAt(head - 4 * CAR);
        shield.position.copy(mid.p).setY(2.5); shield.rotation.y = Math.atan2(-mid.h.x, -mid.h.z);
        shield.visible = atpOn && derail === 0;
        const f = pathAt(head - CAR / 2).p;
        atpLabel.position.set(f.x, 9, f.z);
        pumpLabel.position.set(f.x, 12.5, f.z);
    }
    const hud = $('hud');
    function showSpeed(v) {
        speed = v;
        hud.hidden = false;
        const over = v > 75;
        hud.innerHTML = `<span class="lab">速度</span><b style="color:${over ? '#ff8a80' : '#9dffb0'}">${Math.round(v)}</b><span class="lab">km/h</span><span class="lim">限速 75</span>`;
    }

    const kit = makeKit(scene, { domX: -120, domZ: 170, lanterns: 18, area: { x: 20, z: -40, w: 40, d: 40, y: 3 } });
    const dimmer = makeDimmer(scene, [hemi, dl]);
    function reset() {
        kit.reset(); dimmer.restore();
        head = S0; derail = 0; atpOn = true; follow = null;
        warnMat.emissiveIntensity = 0; warnMat.emissive.setHex(0xff2a2a);
        pumpLabel.material.opacity = 0; atpLabel.material.map = atpTexOn; atpLabel.material.opacity = 1; shieldMat.opacity = .16;
        hud.hidden = true; placeTrain();
    }
    reset();

    const S = {
        wide:  [[-90, 70, 330], [30, 0, 60]],
        train: [[26, 12, 330], [0, 3, 290]],
        curve: [[-34, 16, 28], [14, 0, -36]],
        sky:   [[-50, 22, 40], [14, 18, -40]],
    };
    // 列車沿軌道行駛：從 s0 開到 s1，速度由 v0 變到 v1（km/h，只影響顯示）
    function drive(s1, sec, v0, v1, easing = t => t) {
        const s0 = head;
        return tween(sec, k => { head = s0 + (s1 - s0) * k; showSpeed(v0 + (v1 - v0) * k); }, easing);
    }
    async function crash() {
        flash(); camShake = 1.2;
        kit.puff(pathAt(head).p.toArray(), 30, '190,180,165');
        const s0 = head;
        await tween(2, k => { head = s0 + 22 * k; derail = k; showSpeed(140 * (1 - k)); }, t => 1 - (1 - t) * (1 - t));
        hud.hidden = true;
    }
    return {
        scene, kit, reset,
        intro: '2018・10・21 ・ 宜蘭 蘇澳 新馬站',
        prefix: { 3: '約 16:50，' },
        shots: { wide: S.wide, beats: [S.train, S.train, S.train, S.curve, S.sky] },
        beats: [
            async () => { pumpLabel.material.opacity = 1; await tween(2.4, k => { warnMat.emissiveIntensity = 2.5 * Math.sin(k * Math.PI * 5) ** 2; }); warnMat.emissiveIntensity = 1.6; },
            async () => {
                await tween(1.6, k => { shieldMat.opacity = .16 * (Math.sin(k * Math.PI * 7) > 0 ? 1 : .2); });
                atpOn = false; atpLabel.material.map = atpTexOff; atpLabel.material.needsUpdate = true;
                await wait(1);
            },
            async () => { follow = [18, 9, 34]; await drive(L1 - 30, 4.5, 90, 140, t => t * t); },
            async () => {
                follow = null; moveCamera(...S.curve, 1.5);
                await drive(L1 + 34, 1.4, 140, 140);
                await crash();
            },
            async () => { await dimmer.dim(0x2a2f3a); kit.lanternsOn(true); },
        ],
        memorial: '升起的 18 盞燈，代表 18 條再也回不了家的生命。',
        told: {
            1: '若確實維修保養列車，主風泵不會一再故障，司機員也不會在行車途中手忙腳亂、做出錯誤判斷。',
            2: '若 ATP 沒有被隔離，列車一超速就會自動煞車，不可能以接近兩倍的速限衝進彎道。',
            3: '若司機員遵守速限、在彎道前減速到每小時75公里以下，列車就能安全通過彎道。',
        },
        async safe(k) {
            if (k === 0) { await tween(1, t => { warnMat.emissive.setRGB(0, .9, .4); warnMat.emissiveIntensity = 1.2 * t; }); }
            follow = [18, 9, 34];
            if (k <= 1) {   // ATP 仍在：一超速就自動煞車
                await drive(L1 - 120, 3, 90, 118, t => t * t);
                await tween(.8, t => { shieldMat.opacity = .16 + .3 * Math.sin(t * Math.PI * 4) ** 2; });
                await drive(L1 - 30, 3, 118, 75, t => 1 - (1 - t) * (1 - t));
            } else {        // 司機員依規定減速
                await drive(L1 - 120, 3, 90, 120, t => t * t);
                await drive(L1 - 30, 3.5, 120, 75, t => 1 - (1 - t) * (1 - t));
            }
            follow = null;
            await moveCamera(...S.curve, 1.5);
            return {
                title: '列車平安通過新馬站', text: '列車以安全的速度通過彎道，車上366位旅客都平安抵達目的地。',
                after: async () => { await drive(L1 + R * ARC + 120, 7, 75, 75); hud.hidden = true; },
            };
        },
        update(dt) {
            kit.update(dt);
            placeTrain();
            if (follow) {
                const { p, h } = pathAt(head);
                camera.position.set(p.x + follow[0], follow[1], p.z + follow[2]);
                camLook.copy(p).addScaledVector(h, 20).setY(2);
            }
        },
        leave() { hud.hidden = true; },
    };
}

// ═══════════════════════════════════════════════
// 流程控制
// ═══════════════════════════════════════════════
let river, active;
function useScene(s) { active = s; renderPass.scene = s.scene; }

let stopIndex = 0;
function renderTimeline() {
    const tl = $('timeline');
    tl.innerHTML = '';
    stops.forEach((_, i) => {
        const b = document.createElement('button');
        b.innerHTML = `<span class="d"></span>${i === 0 ? '起點' : isEndStop(i) ? '終點' : EVENTS[i - 1].year}`;
        b.className = i === stopIndex ? 'on' : '';
        b.onclick = () => goStop(i);
        tl.appendChild(b);
    });
}

async function goStop(i) {
    runId++;
    $('btn-river').hidden = true;
    stopIndex = Math.max(0, Math.min(stops.length - 1, i));
    river.setTarget(stops[stopIndex]);
    renderTimeline();
    actions([]);
    if (isEndStop(stopIndex)) return showReflect();
    if (stopIndex === 0) {
        await say('THE RIVER OF TIME', '沿著時間之河前進，每一座門，都是一場改變臺灣的事故。');
    } else {
        const ev = EVENTS[stopIndex - 1];
        await say(`${ev.year} ・ ${ev.title}`, storyData[ev.key].chapters[0].text);
    }
    const nav = [];
    if (stopIndex > 0) nav.push({ label: '◀ 上一站', onClick: () => goStop(stopIndex - 1) });             // 起點不需要上一站
    nav.push({ label: stopIndex === 0 ? '啟航 ▶' : '下一站 ▶', onClick: () => goStop(stopIndex + 1) });
    if (stopIndex > 0) {
        const ev = EVENTS[stopIndex - 1];
        nav.splice(1, 0, ev.has3d
            ? { label: '進入事故現場（3D 因果動畫）', primary: true, onClick: () => enterEvent(ev.key) }
            : { label: '觀看事故故事 ▶', primary: true, onClick: () => playStory(ev) },
            { label: '直接進入分析 →', onClick: () => goAnalysis(ev.key) });
    }
    actions(nav);
}

// ── 終點：重新思考，選一起事故進入分析 ──
function analysisProgress(key) {
    try {
        const st = JSON.parse(localStorage.getItem('safety-guardian-v2') || '{}');
        if (st.submissions?.[key]?.status === 'done') return '已完成';
        const n = Object.keys(st.quizResults?.[key] || {}).length + Object.keys(st.simResults?.[key] || {}).length;
        return n ? '進行中' : '';
    } catch (_) { return ''; }
}
async function showReflect() {
    await say('THE END OF THE RIVER ・ 終點', `${EVENTS.length} 起事故，${EVENTS.length} 條沒有被截斷的因果之河。回頭想一想：你想深入分析哪一起？選一起事故，進入現場模擬與分析。`);
    if (!isEndStop(stopIndex)) return;
    actions([
        ...EVENTS.map(ev => {
            const prog = analysisProgress(ev.key);
            return { label: `${ev.year}｜${ev.title}${prog === '已完成' ? ' ✓' : prog ? '（進行中）' : ''}`, primary: prog !== '已完成', onClick: () => goAnalysis(ev.key) };
        }),
        { label: '◀ 上一站', onClick: () => goStop(stopIndex - 1) },
        { label: '回到起點', onClick: () => goStop(0) },
    ]);
}

// ── 其他事件：在時間之河上以字幕播放故事時間線 ──
async function playStory(ev) {
    const id = ++runId;
    const chs = storyData[ev.key].chapters;
    $('timeline').style.display = 'none';
    $('btn-river').hidden = false;
    for (let i = 0; i < chs.length; i++) {
        await say(`${ev.title} ・ ${chs[i].time} ・ ${chs[i].title}`, chs[i].text);
        if (id !== runId) return;
        await stepButton(i < chs.length - 1 ? `下一幕 ▶（${i + 1}/${chs.length}）` : '看完了 ▶');
    }
    $('btn-river').hidden = true;
    markStorySeen(ev.key);
    await say(ev.title, '接下來，換你親自分析這起事故的因果與預防。');
    if (id !== runId) return;
    $('timeline').style.display = '';
    actions([
        { label: '◀ 回到時間之河', onClick: () => goStop(stopIndex) },
        { label: '進入現場模擬與分析 →', primary: true, onClick: () => goAnalysis(ev.key) },
    ]);
}

// 點擊 3D 場景中的門：先航向那座門，再點一次就開始
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
function gateAt(e) {
    if (active !== river || !$('title-card').classList.contains('gone')) return -1;
    pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(pointer, camera);
    return river.gates.findIndex(g => ray.intersectObject(g.g, true).length > 0);
}
canvas.addEventListener('click', e => {
    if (active === river && $('title-card').classList.contains('gone') && $('timeline').style.display !== 'none') {
        pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        ray.setFromCamera(pointer, camera);
        if (ray.intersectObject(river.endGate, true).length) { goStop(stops.length - 1); return; }
    }
    const i = gateAt(e);
    if (i < 0 || $('timeline').style.display === 'none') return;
    if (stopIndex === i + 1) { const ev = EVENTS[i]; ev.has3d ? enterEvent(ev.key) : playStory(ev); }
    else goStop(i + 1);
});
canvas.addEventListener('pointermove', e => { canvas.style.cursor = gateAt(e) >= 0 ? 'pointer' : ''; });

// ── 3D 事故現場：通用流程（骨牌依序倒下 → 追思 → 抽掉一張骨牌）──
const SCENES3D = { case2: buildParty, case3: buildQuake, puyuma: buildPuyuma, taroko: buildTaroko, mataian: buildMataian };
const built3d = {};
let cur = null, curKey = null;

// 前往平面版的分析頁：用「#taroko.sim」這種簡單格式，並另存一份在本機，確保不會被帶回首頁
function goAnalysis(key) {
    try { localStorage.setItem('sg_goto', `#/${key}/sim`); } catch (_) {}
    location.href = `${SITE}#${key}.sim`;
}

async function enterEvent(key) {
    actions([]);
    music.setMood('solemn');
    subtitle.classList.add('hide');
    await fadeVeil(true);
    if (!built3d[key]) built3d[key] = SCENES3D[key]();
    cur = built3d[key]; curKey = key;
    const id = ++runId;
    $('btn-river').hidden = false;
    cur.kit.dominoes.forEach(d => d.removed = false);
    cur.reset();
    useScene(cur);
    $('timeline').style.display = 'none';
    setCamera(...cur.shots.wide);
    await fadeVeil(false);
    if (id === runId) playEvent(id);
}

async function stepButton(label = '下一步 ▶') {
    return new Promise(res => actions([{ label, primary: true, onClick: () => { actions([]); res(); } }]));
}

async function playEvent(id) {
    const o = cur, key = curKey, d = cases[key].domino;
    const alive = () => id === runId;
    await say(o.intro, storyData[key].chapters[0].text);
    if (!alive()) return;
    await stepButton('讓骨牌開始倒下 ▶');
    for (let i = 0; i < 5; i++) {
        await moveCamera(...o.kit.dom, i ? 1.6 : 2);
        if (!alive()) return;
        await o.kit.fallDomino(i);
        if (!alive()) return;
        moveCamera(...o.shots.beats[i], 2.4);
        await say(`骨牌 ${i + 1} ・ ${DOMINO_NAMES[i]}`, (o.prefix[i] || '') + d[i].factor);
        await o.beats[i]();
        if (!alive()) return;
        if (i < 4) await stepButton();
    }
    await wait(1.5);
    if (!alive()) return;
    await say('', o.memorial);
    markStorySeen(key);
    if (!alive()) return;
    await stepButton('如果能抽掉一張骨牌…… ▶');
    choosePrevention();
}

async function choosePrevention() {
    const o = cur, id = ++runId;
    blockedPicks.clear();
    o.kit.dominoes.forEach(d => d.removed = false);
    o.reset();
    await moveCamera(...o.kit.dom, 2);
    if (id !== runId) return;
    await say('抽掉一張骨牌', '海因里希的骨牌理論說：只要抽掉其中一張，連鎖反應就會中斷。你想抽掉哪一張？');
    if (id !== runId) return;
    showPicks();
}
// 骨牌選項；抽不掉的（意外事故、損失）選過之後會變灰
const blockedPicks = new Set();
function showPicks() {
    actions(DOMINO_NAMES.map((n, i) => ({
        label: blockedPicks.has(i) ? `${i + 1}. ${n}（無法抽掉）` : `${i + 1}. ${n}`,
        cls: 'pick', disabled: blockedPicks.has(i), onClick: () => replayWithout(i),
    })));
}

async function replayWithout(k) {
    const o = cur, id = runId, alive = () => id === runId;
    actions([]);
    if (k >= 3) {
        // 這張骨牌晃一晃，表示抽不掉；說明後直接留在選擇畫面
        const d = o.kit.dominoes[k];
        const say1 = say(`${k + 1}. ${DOMINO_NAMES[k]}：無法抽掉`, k === 3
            ? '意外事故本身無法「直接抽掉」──預防必須在前面的骨牌下手。請改選 1～3 其中一張。'
            : '事故已經發生，只能靠三級到五級預防（救護、治療、復健）減輕損失，無法讓事故不發生。請改選 1～3 其中一張。');
        await tween(.8, t => { d.pivot.rotation.x = Math.sin(t * Math.PI * 6) * .08 * (1 - t); }, t => t);
        d.pivot.rotation.x = 0;
        await say1;
        if (!alive()) return;
        blockedPicks.add(k);
        showPicks();
        return;
    }
    await o.kit.lift(k);
    await say('連鎖反應開始……', '');
    for (let i = 0; i < k; i++) await o.kit.fallDomino(i);
    await wait(.6);
    if (!alive()) return;
    music.sfx('chime');
    await say('連鎖中斷！', o.told[k + 1]);
    // 沒被抽掉的前面幾張骨牌，事件仍會發生
    for (let i = 0; i < k; i++) { moveCamera(...o.shots.beats[i], 2); await o.beats[i](); if (!alive()) return; }
    const end = await o.safe(k);
    if (!alive()) return;
    await say(end.title, end.text);
    if (end.after) await end.after();
    if (!alive()) return;
    actions([
        { label: '再抽一次', onClick: choosePrevention },
        { label: '進入現場模擬與分析 →', primary: true, onClick: () => goAnalysis(curKey) },
        { label: '回到時間之河', onClick: backToRiver },
    ]);
}

async function backToRiver() {
    runId++;
    cur?.leave?.();
    tweens.clear();   // 停止事故現場裡還在進行的動畫
    actions([]);
    $('btn-river').hidden = true;
    camShake = 0;
    music.setMood('calm');
    await fadeVeil(true);
    useScene(river);
    $('timeline').style.display = '';
    await fadeVeil(false);
    goStop(stopIndex);
}

// ═══════════════════════════════════════════════
// 啟動
// ═══════════════════════════════════════════════
const clock = new THREE.Clock();
const lookTmp = new THREE.Vector3();
function loop() {
    const raw = clock.getDelta();
    const dt = Math.min(raw, .05);
    stepTweens(Math.min(raw, .25)); // 動畫依真實時間進行，電腦較慢也不會拖長
    active?.update(dt);
    if (camShake > 0) {
        camShake = Math.max(0, camShake - dt * 1.5);
        camera.position.x += (Math.random() - .5) * camShake;
        camera.position.y += (Math.random() - .5) * camShake;
    }
    camera.lookAt(lookTmp.copy(camLook));
    composer.render(dt);
    requestAnimationFrame(loop);
}

(async function start() {
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]); } catch (_) {}
    river = buildRiver();
    useScene(river);
    river.update(0);
    window.__timelineReady = true;
    $('loading').remove();
    const begin = async () => {
        music.start(); // 瀏覽器規定：音樂必須在使用者點擊後才能開始
        $('title-card').classList.add('gone');
        renderTimeline();
        goStop(0);
    };
    $('btn-start').onclick = begin;
    loop();
    fadeVeil(false);
    // 滑鼠滾輪／鍵盤也能前後移動
    let wheelLock = 0;
    addEventListener('wheel', e => {
        if (active !== river || !$('title-card').classList.contains('gone') || Date.now() < wheelLock) return;
        wheelLock = Date.now() + 900;
        goStop(stopIndex + (e.deltaY > 0 ? 1 : -1));
    }, { passive: true });
    addEventListener('keydown', e => {
        if (active !== river || !$('title-card').classList.contains('gone')) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') goStop(stopIndex + 1);
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') goStop(stopIndex - 1);
    });
    // 從平面版「回到時間之河」：timeline.html#at.taroko（網址被清掉時改讀本機暫存）
    let backAt = (location.hash.match(/^#at\.([a-z0-9]+)$/) || [])[1];
    try { backAt = backAt || localStorage.getItem('sg_river_at'); localStorage.removeItem('sg_river_at'); } catch (_) {}
    if (backAt !== undefined && backAt !== null) {
        addEventListener('pointerdown', () => music.start(), { once: true });
        $('title-card').classList.add('gone');
        const idx = EVENTS.findIndex(e => e.key === backAt);
        stopIndex = idx >= 0 ? idx + 1 : 0;
        river.jump(stops[stopIndex]);
        renderTimeline();
        goStop(stopIndex);
    }
    // 從平面版「以 3D 觀看」直接進入：timeline.html#taroko
    const deep = location.hash.slice(1);
    if (SCENES3D[deep]) {
        addEventListener('pointerdown', () => music.start(), { once: true });
        $('title-card').classList.add('gone');
        stopIndex = EVENTS.findIndex(e => e.key === deep) + 1;
        river.jump(stops[stopIndex]);
        enterEvent(deep);
    }
})().catch(err => { console.error(err); window.__timelineFail(); });
</script>
